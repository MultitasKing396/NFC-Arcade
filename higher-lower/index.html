<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Higher or Lower. – by Alp</title>
<style>
:root{color-scheme:dark;--bg:#171717;--panel:#252525;--panel2:#303030;--edge:#595959;--gold:#d8b66a;--text:#f1eadb;--muted:#aaa397;--red:#c63d43;--black:#20232b;--felt:#174b3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;justify-content:center}
button,select{font:inherit}
button{touch-action:manipulation;cursor:pointer}
.app{width:min(100%,460px);min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:16px 0 10px}
h1{font:700 clamp(30px,8vw,39px)/1.05 Georgia,serif;letter-spacing:.02em;text-align:center;color:var(--gold);margin:0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.stat{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:12px;padding:8px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;font-weight:800}
.stat strong{display:block;font-size:23px;line-height:1.2}
.settings{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px}
select{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:9px;padding:7px 10px}
.table{background:radial-gradient(ellipse at center,#23634f,var(--felt) 65%,#10382e);border:5px solid #674d2c;border-radius:24px;padding:16px 12px 18px;box-shadow:0 8px 0 #0a0a0a,0 15px 28px #0005;position:relative;overflow:hidden}
.table:before{content:"";position:absolute;inset:5px;border:1px solid #ffffff20;border-radius:17px;pointer-events:none}
.card-area{display:flex;align-items:center;justify-content:center;gap:12px;min-height:210px;position:relative;z-index:1}
.playing-card{width:min(39vw,142px);height:min(55vw,198px);max-height:198px;max-width:142px;min-height:165px;background:#fff;border-radius:13px;box-shadow:0 7px 14px #0006;color:#171717;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #ddd;transition:transform .25s ease}
.playing-card.red{color:#c52632}.playing-card.black{color:#171717}
.corner{position:absolute;left:9px;top:7px;display:flex;flex-direction:column;align-items:center;font-weight:900;line-height:1;font-size:21px}
.corner.bottom{left:auto;top:auto;right:9px;bottom:7px;transform:rotate(180deg)}
.corner span{font-size:17px;margin-top:2px}
.suit-big{font-size:clamp(48px,15vw,68px);line-height:1}
.card-back{background:repeating-linear-gradient(45deg,#263b69 0 5px,#e3d6b8 5px 7px,#263b69 7px 12px);border:7px solid #fff;color:#fff}
.card-back:after{content:"♠";font-size:70px;text-shadow:0 2px 7px #000}
.joker-card{background:linear-gradient(145deg,#fff,#f0e4c6);color:#542c8a}
.joker-card .suit-big{font-size:52px}
.current-label{text-align:center;color:#fff;font-size:12px;font-weight:800;letter-spacing:.13em;margin:0 0 10px;position:relative;z-index:1}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1px solid #9e8655;border-radius:13px;background:linear-gradient(#dfc58b,#ae915a);color:#211a10;font-weight:900;font-size:18px;padding:15px 10px;box-shadow:0 4px 0 #17120c;transition:transform .12s,filter .12s}
.choice:active,.primary:active{transform:translateY(2px);filter:brightness(.96);box-shadow:0 2px 0 #17120c}
.choice:disabled{opacity:.4;cursor:not-allowed}
.joker-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:13px}
.joker-chip{display:flex;align-items:center;gap:8px}
.joker-mini{width:26px;height:36px;border-radius:5px;background:#fff;color:#5d318f;display:grid;place-items:center;font-weight:900;border:1px solid #ddd}
.joker-chip small{display:block;color:var(--muted)}
.primary,.secondary{border:1px solid #8d7955;border-radius:11px;padding:11px 15px;font-weight:850}
.primary{background:linear-gradient(#d8bd81,#aa8b53);color:#211b12;box-shadow:0 3px 0 #100e0b}
.secondary{background:var(--panel2);border-color:var(--edge);color:var(--text)}
.message{min-height:22px;text-align:center;color:var(--muted);font-size:13px;font-weight:650}
.footer{margin-top:auto;text-align:center;color:#aaa;font-size:10px;font-weight:800;letter-spacing:.17em;padding:10px 0 4px}
.overlay{position:fixed;inset:0;background:#080808d9;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:22px;z-index:5}
.overlay.show{display:flex}
.dialog{width:min(100%,360px);background:linear-gradient(145deg,#303030,#1c1c1c);border:1px solid var(--edge);border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 60px #0009}
.dialog h2{font:700 27px Georgia,serif;color:var(--gold);margin:0 0 10px}
.dialog p{color:#d0c8b9;line-height:1.5}
.dialog-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(.94)}100%{transform:rotateY(0) scale(1)}}
@keyframes correct{0%{filter:brightness(1)}45%{filter:brightness(1.6);transform:translateY(-5px)}100%{filter:brightness(1);transform:translateY(0)}}
@keyframes wrong{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shuffle{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-15px) rotate(-7deg)}50%{transform:translateX(12px) rotate(6deg)}75%{transform:translateX(-5px) rotate(-3deg)}100%{transform:translateX(0) rotate(0)}}
.flip{animation:flip .48s ease}.correct{animation:correct .45s ease}.wrong{animation:wrong .38s ease}.shuffle{animation:shuffle .7s ease}
body[data-theme="classic"]{--bg:#102b24;--panel:#183a30;--panel2:#21483b;--edge:#8b7145;--gold:#e4c17a;--felt:#1c5b43}
body[data-theme="cyber"]{--bg:#090b18;--panel:#171a31;--panel2:#222744;--edge:#4c65a5;--gold:#6cecff;--text:#e9f2ff;--muted:#a0b1cf;--felt:#101c43}
body[data-theme="cyber"] .table{background:radial-gradient(ellipse at center,#182d69,#0c1230 75%);border-color:#36c9e9;box-shadow:0 0 0 2px #8d54ff55,0 0 25px #31d9ff44}
body[data-theme="cyber"] .table:before{border-color:#54dfff66}
body[data-theme="cosmic"]{--bg:#10101f;--panel:#242039;--panel2:#30294b;--edge:#75649a;--gold:#e8c77e;--text:#f4edff;--muted:#b5a9ca;--felt:#262044}
body[data-theme="cosmic"] .table{background:radial-gradient(ellipse at center,#34305c,#17152e 75%);border-color:#9d7acb;box-shadow:0 0 0 2px #d4b7ff22,0 12px 30px #0008}
body[data-theme="cosmic"] .table:before{border-style:dashed;border-color:#e8c77e66}
@media(max-height:700px){.app{gap:8px;padding-top:10px}.card-area{min-height:175px}.playing-card{height:168px;min-height:150px}.table{padding:11px}.stat{padding:6px}.footer{padding:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body data-theme="classic">
<main class="app">
<h1>Higher or Lower.</h1>
<div class="topline"><div class="stats"><div class="stat"><small>PUNKTE</small><strong id="score">0</strong></div><div class="stat"><small>HIGHSCORE</small><strong id="best">0</strong></div></div></div>
<div class="settings"><label for="theme">Design</label><select id="theme"><option value="classic">Classic Casino</option><option value="cyber">Cyberpunk Neon</option><option value="cosmic">Cosmic Gold</option></select></div>
<section class="table" aria-label="Kartentisch">
<div class="current-label" id="cardLabel">AKTUELLE KARTE</div>
<div class="card-area"><div id="currentCard" class="playing-card card-back" aria-label="Verdeckte Karte"></div><div id="nextCard" class="playing-card card-back hidden" aria-label="Nächste Karte"></div></div>
</section>
<div class="message" id="message" aria-live="polite">Tippe auf Start und rate die nächste Karte.</div>
<div class="controls"><button class="choice" id="higher" disabled>↑ HÖHER</button><button class="choice" id="lower" disabled>↓ NIEDRIGER</button></div>
<div class="joker-row"><div class="joker-chip"><div class="joker-mini">★</div><div><strong>Joker-Rettung</strong><small id="jokerStatus">Noch verfügbar</small></div></div><span id="deckCount">53 Karten im Deck</span></div>
<div class="topline"><button class="primary" id="start">Spiel starten</button><button class="secondary" id="restart">Neue Runde</button></div>
<footer class="footer">by Alp</footer>
</main>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">Spiel beendet</h2><p id="dialogText"></p><div class="dialog-actions"><button class="primary" id="again">Nochmal spielen</button><button class="secondary" id="close">Schließen</button></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const els={score:$('score'),best:$('best'),theme:$('theme'),current:$('currentCard'),next:$('nextCard'),label:$('cardLabel'),message:$('message'),higher:$('higher'),lower:$('lower'),joker:$('jokerStatus'),deck:$('deckCount'),start:$('start'),restart:$('restart'),overlay:$('overlay'),dialogTitle:$('dialogTitle'),dialogText:$('dialogText')};
const suits=[{s:'♠',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'},{s:'♣',c:'black'}];
const symbols={11:'J',12:'Q',13:'K',14:'A'};
let deck=[],current=null,score=0,best=0,jokerAvailable=true,started=false,finished=false,guess=null,waiting=false,freeRetry=false;
const BEST_KEY='higherLowerBest';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){const d=[];for(const suit of suits)for(let v=2;v<=14;v++)d.push({value:v,suit:suit.s,suitClass:suit.c,label:symbols[v]||String(v),joker:false});d.push({joker:true,label:'JOKER'});return shuffle(d)}
function cardName(c){return c.joker?'Joker':c.label+c.suit}
function updateDeck(){els.deck.textContent=deck.length+' Karten im Deck'}
function updateJoker(){els.joker.textContent=jokerAvailable?'Noch verfügbar':'Eingesetzt'}
function setButtons(on){els.higher.disabled=!on;els.lower.disabled=!on}
function rankText(c){return c.joker?'Joker':c.label}
function renderCard(el,c,back=false){el.className='playing-card';if(back){el.classList.add('card-back');el.innerHTML='';return}if(c.joker){el.classList.add('joker-card');el.innerHTML='<span class="corner">★<span>J</span></span><span class="suit-big">🃏</span><span class="corner bottom">★<span>J</span></span>';return}el.classList.add(c.suitClass);el.innerHTML='<span class="corner">'+c.label+'<span>'+c.suit+'</span></span><span class="suit-big">'+c.suit+'</span><span class="corner bottom">'+c.label+'<span>'+c.suit+'</span></span>'}
function drawNext(){if(deck.length===0){els.message.textContent='Deck wird neu gemischt …';els.current.classList.add('shuffle');setTimeout(()=>{deck=makeDeck();updateDeck();els.current.classList.remove('shuffle');dealNext()},720);return}dealNext()}
function dealNext(){if(!deck.length)return;const c=deck.pop();updateDeck();if(c.joker){jokerAvailable=true;updateJoker();els.message.textContent='Joker gezogen! Du kannst ihn für einen späteren Fehler aufbewahren.';drawNextAfterJoker();return}renderCard(els.next,c);els.next.classList.remove('hidden');els.next.classList.add('flip');setTimeout(()=>{els.current.classList.remove('flip','correct','wrong');els.current.classList.add('flip');renderCard(els.current,c);els.current.classList.remove('card-back');els.next.classList.add('hidden');els.next.classList.remove('flip');current=c;waiting=false;setButtons(true);els.label.textContent='AKTUELLE KARTE · '+cardName(current);if(guess){els.message.textContent='Gleicher Wert! Deine Auswahl bleibt bestehen – rate erneut.';setButtons(true)}},230)}
function drawNextAfterJoker(){setTimeout(()=>{if(deck.length===0){deck=makeDeck();updateDeck()}dealNext()},450)}
function start(){deck=makeDeck();current=null;score=0;jokerAvailable=true;started=true;finished=false;guess=null;waiting=false;freeRetry=false;els.score.textContent='0';updateJoker();updateDeck();setButtons(false);els.start.textContent='Lauf aktiv';els.message.textContent='Die erste Karte wird aufgedeckt …';renderCard(els.current,null,true);els.label.textContent='DEINE STARTKARTE';drawNext()}
function choose(direction){if(!started||finished||waiting||!current)return;guess=direction;waiting=true;setButtons(false);if(deck.length===0){deck=makeDeck();updateDeck()}const next=deck.pop();updateDeck();if(next.joker){jokerAvailable=true;updateJoker();els.message.textContent='Joker! Er wird beiseitegelegt. Deine Vorhersage bleibt offen.';setTimeout(()=>resolveWithReplacement(direction),550);return}const ok=next.value===current.value?null:(direction==='higher'?next.value>current.value:next.value<current.value);renderCard(els.next,next);els.next.classList.remove('hidden');els.next.classList.add('flip');setTimeout(()=>{renderCard(els.current,next);els.current.classList.add(ok===true?'correct':ok===false?'wrong':'');els.next.classList.add('hidden');els.next.classList.remove('flip');current=next;els.label.textContent='AKTUELLE KARTE · '+cardName(current);if(ok===true){if(freeRetry){freeRetry=false;els.message.textContent='Joker-Rettung erfolgreich! Kein Punkt für diesen Versuch.'}else{score++;els.score.textContent=score;if(score>best){best=score;els.best.textContent=best;try{localStorage.setItem(BEST_KEY,String(best))}catch(e){}}els.message.textContent='Richtig! +1 Punkt.'}guess=null;waiting=false;setButtons(true)}else if(ok===null){els.message.textContent='Gleicher Kartenwert! Deine Auswahl bleibt bestehen.';waiting=false;setButtons(true)}else if(jokerAvailable){els.message.textContent='Leider falsch – dein Joker rettet dich! Du darfst erneut raten, ohne Punkt.';jokerAvailable=false;updateJoker();guess=null;waiting=false;setButtons(true)}else{endGame()}},260)}
function resolveWithReplacement(direction){if(!deck.length){deck=makeDeck();updateDeck()}const c=deck.pop();updateDeck();if(c.joker){jokerAvailable=true;updateJoker();resolveWithReplacement(direction);return}const ok=c.value===current.value?null:(direction==='higher'?c.value>current.value:c.value<current.value);renderCard(els.current,c);current=c;els.label.textContent='AKTUELLE KARTE · '+cardName(current);if(ok===true){els.message.textContent='Joker beiseitegelegt. Du darfst erneut raten – ohne Punkt für diese Rettung.';guess=null;waiting=false;setButtons(true)}else if(ok===null){els.message.textContent='Gleicher Wert! Deine Auswahl bleibt bestehen.';waiting=false;setButtons(true)}else if(jokerAvailable){jokerAvailable=false;freeRetry=true;updateJoker();els.message.textContent='Dein Joker rettet dich. Erneut raten – der nächste richtige Versuch gibt keinen Punkt.';guess=null;waiting=false;setButtons(true)}else endGame()}
function endGame(){finished=true;waiting=true;setButtons(false);els.message.textContent='Kein Joker mehr – deine Runde ist beendet.';els.dialogTitle.textContent='Runde beendet';els.dialogText.textContent='Du hast '+score+' Punkt'+(score===1?'':'e')+' erzielt. Dein Highscore liegt bei '+best+'.';els.overlay.classList.add('show');els.start.textContent='Spiel starten'}
function closeDialog(){els.overlay.classList.remove('show')}
els.higher.addEventListener('click',()=>choose('higher'));els.lower.addEventListener('click',()=>choose('lower'));els.start.addEventListener('click',start);els.restart.addEventListener('click',start);$('again').addEventListener('click',()=>{closeDialog();start()});$('close').addEventListener('click',closeDialog);
els.theme.addEventListener('change',()=>{document.body.dataset.theme=els.theme.value;try{localStorage.setItem('higherLowerTheme',els.theme.value)}catch(e){}});
try{best=Number(localStorage.getItem(BEST_KEY)||0);const t=localStorage.getItem('higherLowerTheme');if(t&&['classic','cyber','cosmic'].includes(t)){els.theme.value=t;document.body.dataset.theme=t}}catch(e){}els.best.textContent=best;updateDeck();updateJoker();
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();
</script>
</body></html>
