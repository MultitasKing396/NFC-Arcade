<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Guess the Card. – by Alp</title>
<style>
:root{color-scheme:dark;--bg:#171717;--panel:#252525;--panel2:#303030;--edge:#595959;--gold:#d8b66a;--text:#f1eadb;--muted:#aaa397;--red:#c63d43;--black:#20232b;--felt:#174b3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:none}
body{min-height:100dvh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;justify-content:center}
button,select{font:inherit}
button{touch-action:manipulation;cursor:pointer}
.app{width:min(100%,460px);min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:16px 0 10px}
h1{font:700 clamp(30px,8vw,39px)/1.05 Georgia,serif;letter-spacing:.02em;text-align:center;color:var(--gold);margin:0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:8px}.modebar h1{text-align:left;min-width:0;font-size:clamp(25px,6.5vw,34px)}#mode{max-width:145px;flex-shrink:0;font-size:12px;font-weight:800;padding:9px 8px;border-color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.stat{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:12px;padding:8px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;font-weight:800}
.stat strong{display:block;font-size:23px;line-height:1.2}
.settings{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px}.setting-pair{justify-content:space-between;gap:12px}.setting{display:flex;align-items:center;gap:7px;min-width:0}.setting select{min-width:0;max-width:170px}.setting label{white-space:nowrap;font-weight:750}
select{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:9px;padding:7px 10px}
.table{background:radial-gradient(ellipse at center,#23634f,var(--felt) 65%,#10382e);border:5px solid #674d2c;border-radius:24px;padding:16px 12px 18px;box-shadow:0 8px 0 #0a0a0a,0 15px 28px #0005;position:relative;overflow:hidden}
.table:before{content:"";position:absolute;inset:5px;border:1px solid #ffffff20;border-radius:17px;pointer-events:none}
.card-area{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:210px;position:relative;z-index:1;padding:0 10px}
.deck-stack{width:min(39vw,142px);height:min(55vw,198px);max-width:142px;min-height:165px;position:relative;flex-shrink:0}
.deck-stack:before,.deck-stack:after{content:"";position:absolute;inset:0;border-radius:13px;background:repeating-linear-gradient(45deg,#263b69 0 5px,#e3d6b8 5px 7px,#263b69 7px 12px);border:5px solid #fff;box-shadow:0 4px 8px #0005}
.deck-stack:before{transform:translate(-5px,4px) rotate(-3deg);opacity:.8}
.deck-stack:after{transform:translate(-2px,2px) rotate(-1.5deg)}
.deck-stack .deck-top{position:absolute;inset:0;z-index:1;border-radius:13px}
.deck-caption{position:absolute;top:calc(100% + 7px);left:0;right:0;text-align:center;color:#fff;font-size:10px;font-weight:850;letter-spacing:.12em}
.card-area #currentCard{z-index:1}
.card-area #nextCard{position:absolute;left:10px;top:50%;z-index:3;transform:translateY(-50%);display:flex}
.card-area #nextCard.dealing{animation:dealCard .684s cubic-bezier(.2,.72,.25,1) forwards}
@keyframes dealCard{0%{transform:translate(0,-50%) rotateY(0deg);z-index:3}44%{transform:translate(calc(var(--move-x)*.44),-50%) rotateY(88deg)}56%{transform:translate(calc(var(--move-x)*.56),-50%) rotateY(88deg)}100%{transform:translate(var(--move-x),-50%) rotateY(0deg)}}
.playing-card{width:min(39vw,142px);height:min(55vw,198px);max-height:198px;max-width:142px;min-height:165px;background:#fff;border-radius:13px;box-shadow:0 7px 14px #0006;color:#171717;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #ddd;transition:transform .25s ease}
.playing-card.red{color:#c52632}.playing-card.black{color:#171717}
.corner{position:absolute;left:9px;top:7px;display:flex;flex-direction:column;align-items:center;font-weight:900;line-height:1;font-size:21px}
.corner.bottom{left:auto;top:auto;right:9px;bottom:7px;transform:rotate(180deg)}
.corner span{font-size:17px;margin-top:2px}
.suit-big{font-size:clamp(48px,15vw,68px);line-height:1}
.card-back{background:repeating-linear-gradient(45deg,#263b69 0 5px,#e3d6b8 5px 7px,#263b69 7px 12px);border:7px solid #fff;color:#fff}
.card-back:after{content:"♠";font-size:70px;text-shadow:0 2px 7px #000}
.joker-card{background:linear-gradient(145deg,#fff,#f0e4c6);color:#542c8a}
.joker-card .suit-big{font-size:52px}
.current-label{text-align:center;color:#fff;font-size:12px;font-weight:800;letter-spacing:.13em;margin:0 0 10px;position:relative;z-index:1}
.controls{display:flex;flex-direction:column;gap:10px}.controls .choice{width:100%}.controls .joker-row{width:100%}
.controls.color-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls.color-mode .choice{grid-row:1;min-height:58px}.controls.color-mode .joker-row{grid-column:1/-1;grid-row:2}
#higher.red-choice{background:#d94b50;color:#171717;border:1px solid #ff8585;box-shadow:0 4px 0 #78252a}
#lower.black-choice{background:#171717;color:#e34850;border:1px solid #686868;box-shadow:0 4px 0 #080808}
.choice{border:1px solid #9e8655;border-radius:13px;background:linear-gradient(#dfc58b,#ae915a);color:#211a10;font-weight:900;font-size:18px;padding:15px 10px;box-shadow:0 4px 0 #17120c;transition:transform .12s,filter .12s}
.choice:active,.primary:active{transform:translateY(2px);filter:brightness(.96);box-shadow:0 2px 0 #17120c}
.choice:disabled{opacity:.4;cursor:not-allowed}
.joker-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:13px}
.joker-chip{display:flex;align-items:center;gap:8px}
.joker-mini{width:26px;height:36px;border-radius:5px;background:#fff;color:#5d318f;display:grid;place-items:center;font-weight:900;border:1px solid #ddd}
.joker-chip small{display:block;color:var(--muted)}
.primary,.secondary{border:1px solid #8d7955;border-radius:11px;padding:11px 15px;font-weight:850}
.primary{background:linear-gradient(#d8bd81,#aa8b53);color:#211b12;box-shadow:0 3px 0 #100e0b}
.primary.confirm{background:#fff;color:#171717;border:2px solid #fff;box-shadow:0 3px 0 #bdbdbd}
.secondary{background:var(--panel2);border-color:var(--edge);color:var(--text)}
.duel-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:2px}.player-side{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 8px;border:1px solid var(--edge);border-radius:14px;background:var(--panel);opacity:.42;transition:opacity .2s,box-shadow .2s,border-color .2s}.player-side.active{opacity:1;border-color:var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}.player-side>strong{font-size:11px;letter-spacing:.12em;color:var(--muted)}.player-score{font-size:23px;font-weight:900}.player-joker{font-size:11px;color:var(--muted);font-weight:750}.player-buttons{display:flex;flex-direction:column;gap:7px;width:100%}.duel-choice{font-size:14px;padding:12px 5px;min-height:48px}.duel-choice:disabled{opacity:.22}
#p1a.red-choice,#p2a.red-choice{background:#d94b50;color:#171717;border:1px solid #ff8585;box-shadow:0 4px 0 #78252a}
#p1b.black-choice,#p2b.black-choice{background:#171717;color:#e34850;border:1px solid #686868;box-shadow:0 4px 0 #080808}
.app.duel-mode #gameTitle,.app.duel-mode>.topline:not(:has(#start)),.app.duel-mode #message,.app.duel-mode #controls{display:none!important}.app.duel-mode{justify-content:center;gap:10px}.app.duel-mode .table{width:100%;padding:10px 8px 13px}.app.duel-mode .card-area{min-height:145px;gap:7px;padding:0 4px}.app.duel-mode .deck-stack{width:clamp(62px,19vw,88px);height:clamp(92px,28vw,132px);min-height:0}.app.duel-mode .playing-card{width:clamp(62px,19vw,88px);height:clamp(92px,28vw,132px);min-height:0}.app.duel-mode .suit-big{font-size:clamp(34px,10vw,48px)}.app.duel-mode .corner{font-size:15px;left:5px;top:5px}.app.duel-mode .corner span{font-size:12px}.app.duel-mode .corner.bottom{left:auto;right:5px;top:auto;bottom:5px}.app.duel-mode .deck-caption{font-size:8px}.app.duel-mode #duelControls{display:contents}
.app.duel-mode #playerTwo{order:1;transform:rotate(180deg);width:100%}
.app.duel-mode .table{order:2}
.app.duel-mode #playerOne{order:3;width:100%}
.app.duel-mode .topline:has(#start){order:4}
.app.duel-mode .footer{order:5}
.app.duel-mode .current-label{font-size:10px;margin-bottom:6px}.app.duel-mode .topline:has(#start){justify-content:center}.app.duel-mode #start{width:100%;max-width:220px}.player-side.active .duel-choice:not(:disabled){filter:brightness(1.12);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 55%,transparent),0 4px 0 #17120c}.player-side.inactive .duel-choice{filter:brightness(.48)}.message{min-height:22px;text-align:center;color:var(--muted);font-size:13px;font-weight:650}
.footer{margin-top:auto;text-align:center;color:#aaa;font-size:10px;font-weight:800;letter-spacing:.17em;padding:10px 0 4px}
.overlay{position:fixed;inset:0;background:#080808d9;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:22px;z-index:5}
.overlay.show{display:flex}
.dialog{width:min(100%,360px);background:linear-gradient(145deg,#303030,#1c1c1c);border:1px solid var(--edge);border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 60px #0009}
.dialog h2{font:700 27px Georgia,serif;color:var(--gold);margin:0 0 10px}
.dialog p{color:#d0c8b9;line-height:1.5}
.dialog-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(.94)}100%{transform:rotateY(0) scale(1)}}
@keyframes correct{0%{filter:brightness(1)}45%{filter:brightness(1.6);transform:translateY(-5px)}100%{filter:brightness(1);transform:translateY(0)}}
@keyframes wrong{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shuffle{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-15px) rotate(-7deg)}50%{transform:translateX(12px) rotate(6deg)}75%{transform:translateX(-5px) rotate(-3deg)}100%{transform:translateX(0) rotate(0)}}
.flip{animation:flip .48s ease}.correct{animation:correct .45s ease}.wrong{animation:wrong .38s ease}.shuffle{animation:shuffle .7s ease}
body[data-theme="classic"]{--bg:#102b24;--panel:#183a30;--panel2:#21483b;--edge:#8b7145;--gold:#e4c17a;--felt:#1c5b43}
body[data-theme="cyber"]{--bg:#090b18;--panel:#171a31;--panel2:#222744;--edge:#4c65a5;--gold:#6cecff;--text:#e9f2ff;--muted:#a0b1cf;--felt:#101c43}
body[data-theme="cyber"] .table{background:radial-gradient(ellipse at center,#182d69,#0c1230 75%);border-color:#36c9e9;box-shadow:0 0 0 2px #8d54ff55,0 0 25px #31d9ff44}
body[data-theme="cyber"] .table:before{border-color:#54dfff66}
body[data-theme="cosmic"]{--bg:#10101f;--panel:#242039;--panel2:#30294b;--edge:#75649a;--gold:#e8c77e;--text:#f4edff;--muted:#b5a9ca;--felt:#262044}
body[data-theme="cosmic"] .table{background:radial-gradient(ellipse at center,#34305c,#17152e 75%);border-color:#9d7acb;box-shadow:0 0 0 2px #d4b7ff22,0 12px 30px #0008}
body[data-theme="cosmic"] .table:before{border-style:dashed;border-color:#e8c77e66}

/* Theme-specific playing-card faces; Classic Casino intentionally remains untouched. */
body[data-theme="cyber"] .playing-card:not(.card-back){
  background:linear-gradient(145deg,#17254b 0%,#0b1027 58%,#1b1640 100%);
  color:#72efff;border:2px solid #55eaff;
  box-shadow:inset 0 0 0 4px #111a36,inset 0 0 22px #28cfff38,0 0 16px #29dfff55,0 7px 14px #0008;
  border-radius:10px;
}
body[data-theme="cyber"] .playing-card:not(.card-back):before{
  content:"";position:absolute;inset:8px;border:1px solid #55eaff88;
  background:repeating-linear-gradient(135deg,transparent 0 13px,#53dfff0c 13px 15px);
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);pointer-events:none;
}
body[data-theme="cyber"] .playing-card:not(.card-back) .corner,
body[data-theme="cyber"] .playing-card:not(.card-back) .suit-big{z-index:1;text-shadow:0 0 7px currentColor,0 0 15px #25dfff88}
body[data-theme="cyber"] .playing-card.red{color:#ff5bba}
body[data-theme="cyber"] .card-back{
  background:repeating-linear-gradient(135deg,#111a3c 0 8px,#1d3970 8px 11px,#111a3c 11px 19px);
  border:7px solid #5cecff;color:#70f4ff;box-shadow:0 0 18px #35dfff66,inset 0 0 0 2px #b6faff;
}
body[data-theme="cyber"] .card-back:after{content:"✦";font-size:76px;color:#70f4ff;text-shadow:0 0 8px #42eaff,0 0 24px #9d5bff}
body[data-theme="cyber"] .joker-card{background:radial-gradient(circle at 50% 35%,#34236c,#10152e 72%);color:#ff70d2;border-color:#d36cff}

body[data-theme="cosmic"] .playing-card:not(.card-back){
  background:radial-gradient(ellipse at 50% 35%,#40345d 0%,#211a38 62%,#151326 100%);
  color:#f0d18a;border:2px solid #d6b66f;
  box-shadow:inset 0 0 0 4px #211a35,inset 0 0 0 6px #a9874d88,inset 0 0 24px #d7b86b22,0 7px 14px #0009;
  border-radius:12px;
}
body[data-theme="cosmic"] .playing-card:not(.card-back):before{
  content:"✧     ·     ✦";position:absolute;inset:9px;border:1px solid #d8bd7b88;border-radius:7px;
  display:flex;align-items:flex-start;justify-content:center;padding-top:14px;
  font:20px Georgia,serif;letter-spacing:9px;color:#e8ce91;text-shadow:0 0 9px #e8c77e66;pointer-events:none;
}
body[data-theme="cosmic"] .playing-card:not(.card-back) .corner,
body[data-theme="cosmic"] .playing-card:not(.card-back) .suit-big{z-index:1;text-shadow:0 1px 8px #e8c77e55}
body[data-theme="cosmic"] .playing-card.red{color:#ef8b9d}
body[data-theme="cosmic"] .card-back{
  background:radial-gradient(circle,#4c3a70 0 2px,transparent 3px),repeating-conic-gradient(from 12deg at 50% 50%,#2c2448 0 10deg,#4a3a68 10deg 20deg);
  background-size:18px 18px,100% 100%;border:7px double #e5c77e;color:#f0d18a;
  box-shadow:0 0 0 2px #5d477e,0 0 18px #d9b76b44,inset 0 0 0 2px #f4dfaa;
}
body[data-theme="cosmic"] .card-back:after{content:"✦";font-size:76px;color:#f3d78e;text-shadow:0 0 8px #e8c77e,0 0 25px #d8a9ff}
body[data-theme="cosmic"] .joker-card{background:radial-gradient(circle at center,#55406d,#21182f 75%);color:#f4d58e;border-color:#e8c77e}
@media(max-height:700px){.app{gap:8px;padding-top:10px}.card-area{min-height:175px}.playing-card{height:168px;min-height:150px}.table{padding:11px}.stat{padding:6px}.footer{padding:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body data-theme="classic">
<main class="app">
<h1 id="gameTitle">Guess the Card.</h1>
<div class="topline"><div class="stats"><div class="stat"><small>PUNKTE</small><strong id="score">0</strong></div><div class="stat"><small>HIGHSCORE</small><strong id="best">0</strong></div></div></div>
<div class="settings setting-pair"><div class="setting"><label for="theme">Design</label><select id="theme"><option value="classic">Classic Casino</option><option value="cyber">Cyberpunk Neon</option><option value="cosmic">Cosmic Gold</option></select></div><div class="setting"><label for="mode">Modus</label><select id="mode" aria-label="Spielmodus"><option value="higher">Higher or Lower</option><option value="color">Red or Black</option><option value="higher2">Higher or Lower · 2 Spieler</option><option value="color2">Red or Black · 2 Spieler</option></select></div></div>
<section class="table" aria-label="Kartentisch">
<div class="current-label" id="cardLabel">AKTUELLE KARTE</div>
<div class="card-area"><div class="deck-stack" aria-label="Kartendeck"><div class="deck-top card-back"></div><div class="deck-caption">KARTENDECK</div></div><div id="currentCard" class="playing-card card-back" aria-label="Aktuelle Karte"></div><div id="nextCard" class="playing-card card-back hidden" aria-label="Gezogene Karte"></div></div>
</section>
<div class="duel-controls hidden" id="duelControls"><div class="player-side" id="playerOne"><strong>SPIELER 1</strong><span class="player-score" id="scoreOne">0</span><small class="player-joker" id="jokerOne">0/2 Joker</small><div class="player-buttons"><button class="choice duel-choice" id="p1a" disabled></button><button class="choice duel-choice" id="p1b" disabled></button></div></div><div class="player-side" id="playerTwo"><strong>SPIELER 2</strong><span class="player-score" id="scoreTwo">0</span><small class="player-joker" id="jokerTwo">0/2 Joker</small><div class="player-buttons"><button class="choice duel-choice" id="p2a" disabled></button><button class="choice duel-choice" id="p2b" disabled></button></div></div></div>
<div class="message" id="message" aria-live="polite">Tippe auf Start und rate die nächste Karte.</div>
<div class="controls" id="controls"><button class="choice" id="higher" disabled>↑ HÖHER</button><div class="joker-row"><div class="joker-chip"><div class="joker-mini">★</div><div><strong>Joker-Rettung</strong><small id="jokerStatus">Noch verfügbar</small></div></div><span id="deckCount">53 Karten im Deck</span></div><button class="choice" id="lower" disabled>↓ NIEDRIGER</button></div>
<div class="topline"><button class="primary" id="start">Spiel starten</button></div>
<footer class="footer">by Alp</footer>
</main>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">Spiel beendet</h2><p id="dialogText"></p><div class="dialog-actions"><button class="primary" id="again">Nochmal spielen</button><button class="secondary" id="close">Schließen</button></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const els={score:$('score'),best:$('best'),theme:$('theme'),mode:$('mode'),gameTitle:$('gameTitle'),controls:$('controls'),duelControls:$('duelControls'),current:$('currentCard'),next:$('nextCard'),area:document.querySelector('.card-area'),label:$('cardLabel'),message:$('message'),higher:$('higher'),lower:$('lower'),joker:$('jokerStatus'),deck:$('deckCount'),start:$('start'),overlay:$('overlay'),dialogTitle:$('dialogTitle'),dialogText:$('dialogText')};
const suits=[{s:'♠',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'},{s:'♣',c:'black'}];
const symbols={1:'A',11:'J',12:'Q',13:'K'};
function setMode(next){twoPlayer=next.endsWith('2');mode=twoPlayer?next.slice(0,-1):next;document.querySelector('.app').classList.toggle('duel-mode',twoPlayer);els.duelControls.classList.toggle('hidden',!twoPlayer);els.gameTitle.textContent='Guess the Card.';els.higher.textContent=mode==='higher'?'↑ HÖHER':'ROT';els.lower.textContent=mode==='higher'?'↓ NIEDRIGER':'SCHWARZ';els.higher.classList.toggle('red-choice',mode==='color');els.lower.classList.toggle('black-choice',mode==='color');els.controls.classList.toggle('color-mode',mode==='color');configureDuelButtons();try{best=Number(localStorage.getItem(BEST_KEYS[mode])||0)}catch(e){best=0}els.best.textContent=best;els.message.textContent=mode==='higher'?'Tippe auf Start und rate die nächste Karte.':'Tippe auf Start und rate, ob die nächste Karte rot oder schwarz ist.';}
let deck=[],current=null,score=0,best=0,jokerCharges=[0,0],started=false,finished=false,guess=null,waiting=false,freeRetry=false,restartArmed=false,mode='higher',twoPlayer=false,activePlayer=1,playerScores=[0,0],shootout=false,shootoutFirst=null,shootoutOpener=1,shootoutFirstPlayer=1;
const BEST_KEYS={higher:'higherLowerBest',color:'redBlackBest'};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){const d=[];for(const suit of suits)for(let v=1;v<=13;v++)d.push({value:v,suit:suit.s,suitClass:suit.c,label:symbols[v]||String(v),joker:false});d.push({joker:true,label:'JOKER'},{joker:true,label:'JOKER'});return shuffle(d)}
function cardName(c){return c.joker?'Joker':c.label+c.suit}
function configureDuelButtons(){const labels=mode==='higher'?['↑ HÖHER','↓ TIEFER']:['ROT','SCHWARZ'];[['p1a','p1b'],['p2a','p2b']].forEach(ids=>{ $(ids[0]).textContent=labels[0];$(ids[1]).textContent=labels[1];$(ids[0]).classList.toggle('red-choice',mode==='color');$(ids[1]).classList.toggle('black-choice',mode==='color')});updatePlayerTurn()}
function updatePlayerTurn(){if(!twoPlayer)return;['playerOne','playerTwo'].forEach((id,i)=>{$(id).classList.toggle('active',activePlayer===i+1);$(id).classList.toggle('inactive',activePlayer!==i+1)});['p1a','p1b','p2a','p2b'].forEach(id=>$(id).disabled=!started||finished||waiting||(activePlayer===1?!id.startsWith('p1'):!id.startsWith('p2')))}
function setPlayerButtons(on){if(!twoPlayer)return;['p1a','p1b','p2a','p2b'].forEach(id=>$(id).disabled=!on||(activePlayer===1?!id.startsWith('p1'):!id.startsWith('p2')))}
function finishPlayerTurn(){if(twoPlayer){activePlayer=activePlayer===1?2:1;updatePlayerTurn()}}
function updateDeck(){els.deck.textContent=deck.length+' Karten im Deck'}
function jokerOwner(){return twoPlayer?activePlayer-1:0}
function updateJoker(){if(twoPlayer){$('jokerOne').textContent=jokerCharges[0]+'/2 Joker';$('jokerTwo').textContent=jokerCharges[1]+'/2 Joker';els.joker.textContent='Joker: '+jokerCharges[0]+' / '+jokerCharges[1]}else{els.joker.textContent=jokerCharges[0]+'/2 geladen'}}
function chargeJoker(){const i=jokerOwner();jokerCharges[i]=Math.min(2,jokerCharges[i]+1);updateJoker()}
function spendJoker(){const i=jokerOwner();if(jokerCharges[i]<=0)return false;jokerCharges[i]--;updateJoker();return true}
function setButtons(on){els.higher.disabled=!on;els.lower.disabled=!on;if(twoPlayer)setPlayerButtons(on)}
function rankText(c){return c.joker?'Joker':c.label}
function renderCard(el,c,back=false){const wasDealing=el.classList.contains('dealing');el.className='playing-card';if(wasDealing)el.classList.add('dealing');if(back){el.classList.add('card-back');el.innerHTML='';return}if(c.joker){el.classList.add('joker-card');el.innerHTML='<span class="corner">★<span>J</span></span><span class="suit-big">🃏</span><span class="corner bottom">★<span>J</span></span>';return}el.classList.add(c.suitClass);el.innerHTML='<span class="corner">'+c.label+'<span>'+c.suit+'</span></span><span class="suit-big">'+c.suit+'</span><span class="corner bottom">'+c.label+'<span>'+c.suit+'</span></span>'}
function drawNext(){if(deck.length===0){endGame();return}dealNext()}
function animateDeal(c,onDone){
  renderCard(els.next,null,true);
  els.next.classList.remove('hidden','flip','dealing');
  void els.next.offsetWidth;
  const travel=Math.max(0,els.area.clientWidth-els.next.offsetWidth-20);
  els.next.style.setProperty('--move-x',travel+'px');
  void els.next.offsetWidth;
  els.next.classList.add('dealing');
  const flipTimer=setTimeout(()=>renderCard(els.next,c),350);
  els.next.addEventListener('animationend',function finish(e){
    if(e.animationName!=='dealCard')return;
    els.next.removeEventListener('animationend',finish);
    clearTimeout(flipTimer);
    els.next.classList.remove('dealing');
    els.next.classList.add('hidden');
    renderCard(els.current,c);
    current=c;
    if(onDone)onDone();
  });
}
function dealNext(){if(!deck.length)return;const c=deck.pop();updateDeck();if(c.joker){chargeJoker();els.message.textContent='Joker gezogen! Deine Joker-Rettung wurde aufgeladen.';drawNextAfterJoker();return}animateDeal(c,()=>{waiting=false;setButtons(true);els.label.textContent='AKTUELLE KARTE · '+cardName(current);if(guess){els.message.textContent='Gleicher Wert! Deine Auswahl bleibt bestehen – rate erneut.';setButtons(true)}})}
function drawNextAfterJoker(){setTimeout(()=>{if(deck.length===0){endGame();return}dealNext()},450)}
function start(){closeDialog();restartArmed=false;shootout=false;shootoutFirst=null;shootoutOpener=1;shootoutFirstPlayer=1;activePlayer=1;playerScores=[0,0];$('scoreOne').textContent='0';$('scoreTwo').textContent='0';els.start.classList.remove('confirm');els.start.textContent='Neustarten';deck=makeDeck();current=null;score=0;jokerCharges=[0,0];started=true;finished=false;guess=null;waiting=false;freeRetry=false;els.score.textContent='0';updateJoker();updatePlayerTurn();updateDeck();setButtons(false);els.start.textContent='Neustarten';els.message.textContent='Die erste Karte wird aufgedeckt …';renderCard(els.current,null,true);els.label.textContent='DEINE STARTKARTE';drawNext()}
function applyDuelOutcome(ok){
  if(twoPlayer&&shootout){finishShootoutAttempt(ok);return}
  if(!twoPlayer&&ok===false){
    if(spendJoker()){els.message.textContent='Leider falsch – deine Joker-Rettung greift! Du darfst erneut raten, ohne Punkt.';guess=null;waiting=false;setButtons(true)}
    else endGame();
    return;
  }
  if(ok===true){
    if(twoPlayer){playerScores[activePlayer-1]++;$('score'+(activePlayer===1?'One':'Two')).textContent=playerScores[activePlayer-1];els.message.textContent='Richtig! +1 Punkt.'}
    else{score++;els.score.textContent=score;if(score>best){best=score;els.best.textContent=best;try{localStorage.setItem(BEST_KEYS[mode],String(best))}catch(e){}}els.message.textContent='Richtig! +1 Punkt.'}
  }else if(ok===null){els.message.textContent='Gleicher Kartenwert! Kein Punkt – der andere Spieler ist an der Reihe.'}
  else{
    const rescued=spendJoker();
    els.message.textContent=rescued?'Leider falsch – dein Joker wurde eingesetzt. Kein Punkt; der andere Spieler ist an der Reihe.':'Leider falsch! Kein Punkt – der andere Spieler ist an der Reihe.';
  }
  guess=null;waiting=false;
  if(twoPlayer)finishPlayerTurn();
  if(twoPlayer&&deck.length===0){
    if(playerScores[0]===playerScores[1])beginShootout();
    else endGame();
    return;
  }
  setButtons(true);
}
function beginShootout(){
  shootout=true;shootoutFirst=null;shootoutOpener=1;shootoutFirstPlayer=1;activePlayer=shootoutOpener;deck=makeDeck();updateDeck();waiting=false;guess=null;
  els.message.textContent='STECHEN! Sudden Death – Spieler 1 beginnt. Beide Spieler bekommen je einen Versuch.';
  els.label.textContent='STECHEN · SPIELER 1';
  updatePlayerTurn();setButtons(true);
}
function finishShootoutAttempt(ok){
  const success=ok===true;
  if(shootoutFirst===null){
    shootoutFirst=success;shootoutFirstPlayer=activePlayer;activePlayer=activePlayer===1?2:1;waiting=false;guess=null;
    els.message.textContent=success?'Spieler '+shootoutFirstPlayer+' trifft vor! Spieler '+activePlayer+' muss nachziehen.':'Spieler '+shootoutFirstPlayer+' verfehlt! Spieler '+activePlayer+' muss treffen, um auszugleichen.';
    els.label.textContent='STECHEN · SPIELER '+activePlayer;
    updatePlayerTurn();setButtons(true);return;
  }
  if(success!==shootoutFirst){
    const winner=success?activePlayer:shootoutFirstPlayer;
    els.dialogTitle.textContent='Sieger: Spieler '+winner;
    els.dialogText.textContent='Stechen entschieden! Spieler 1: '+playerScores[0]+' Punkte · Spieler 2: '+playerScores[1]+' Punkte.';
    finishMatch('Stechen entschieden – Spieler '+winner+' gewinnt!');
    return;
  }
  shootoutFirst=null;shootoutOpener=shootoutOpener===1?2:1;activePlayer=shootoutOpener;waiting=false;guess=null;
  if(deck.length===0){deck=makeDeck();updateDeck()}
  els.message.textContent='Beide Spieler '+(success?'haben getroffen':'haben verfehlt')+' – Gleichstand! Spieler '+shootoutOpener+' legt in der nächsten Runde vor.';
  els.label.textContent='STECHEN · SPIELER '+shootoutOpener;
  updatePlayerTurn();setButtons(true);
}
function finishMatch(message){
  finished=true;waiting=true;restartArmed=false;els.start.classList.remove('confirm');els.start.textContent='Spiel starten';setButtons(false);els.message.textContent=message;els.overlay.classList.add('show');
}
function choose(direction){
  if(!started||finished||waiting||!current)return;
  guess=direction;waiting=true;setButtons(false);
  if(deck.length===0){if(shootout){deck=makeDeck();updateDeck()}else{endGame();return}}
  const next=deck.pop();updateDeck();
  if(next.joker){chargeJoker();els.message.textContent='Joker gezogen! Joker aufgeladen – die Vorhersage bleibt offen.';setTimeout(()=>resolveWithReplacement(direction),450);return}
  const ok=mode==='color'?(next.suitClass===direction):(next.value===current.value?null:(direction==='higher'?next.value>current.value:next.value<current.value));
  animateDeal(next,()=>{els.current.classList.add(ok===true?'correct':ok===false?'wrong':'');els.label.textContent='AKTUELLE KARTE · '+cardName(current);applyDuelOutcome(ok)});
}
function resolveWithReplacement(direction){
  if(!deck.length){deck=makeDeck();updateDeck()}
  const c=deck.pop();updateDeck();
  if(c.joker){chargeJoker();els.message.textContent='Joker gezogen! Joker aufgeladen.';resolveWithReplacement(direction);return}
  const ok=mode==='color'?(c.suitClass===direction):(c.value===current.value?null:(direction==='higher'?c.value>current.value:c.value<current.value));
  renderCard(els.current,c);current=c;els.label.textContent='AKTUELLE KARTE · '+cardName(current);
  applyDuelOutcome(ok);
}
function endGame(){
  if(finished)return;
  finished=true;waiting=true;restartArmed=false;els.start.classList.remove('confirm');els.start.textContent='Spiel starten';setButtons(false);
  if(twoPlayer){
    const a=playerScores[0],b=playerScores[1];
    if(a===b){beginShootout();return}
    els.dialogTitle.textContent=a>b?'Sieger: Spieler 1':'Sieger: Spieler 2';
    els.dialogText.textContent='Spieler 1: '+a+' Punkte · Spieler 2: '+b+' Punkte. Das Kartendeck ist vollständig durchgespielt.';
    els.message.textContent='Match beendet – das Deck ist leer.';
  }else{
    els.dialogTitle.textContent='Spiel beendet';
    els.dialogText.textContent='Du hast '+score+' Punkt'+(score===1?'':'e')+' erzielt. Dein Highscore liegt bei '+best+'.';
    els.message.textContent='Das Kartendeck ist vollständig durchgespielt.';
  }
  els.overlay.classList.add('show');
}
function closeDialog(){els.overlay.classList.remove('show')}
function requestStartOrRestart(){
  if(started&&!finished){
    if(!restartArmed){
      restartArmed=true;
      els.start.textContent='Sicher';
      els.start.classList.add('confirm');
      return;
    }
    start();
    return;
  }
  start();
}
els.higher.addEventListener('click',()=>choose(mode==='color'?'red':'higher'));els.lower.addEventListener('click',()=>choose(mode==='color'?'black':'lower'));$('p1a').addEventListener('click',()=>{if(twoPlayer&&activePlayer===1)choose(mode==='color'?'red':'higher')});$('p1b').addEventListener('click',()=>{if(twoPlayer&&activePlayer===1)choose(mode==='color'?'black':'lower')});$('p2a').addEventListener('click',()=>{if(twoPlayer&&activePlayer===2)choose(mode==='color'?'red':'higher')});$('p2b').addEventListener('click',()=>{if(twoPlayer&&activePlayer===2)choose(mode==='color'?'black':'lower')});els.mode.addEventListener('change',()=>{setMode(els.mode.value);start()});els.start.addEventListener('click',requestStartOrRestart);
$('again').addEventListener('click',()=>{start();$('again').textContent='Nochmal spielen';$('close').textContent='Schließen'});
$('close').addEventListener('click',()=>{closeDialog();$('again').textContent='Nochmal spielen';$('close').textContent='Schließen'});
els.theme.addEventListener('change',()=>{document.body.dataset.theme=els.theme.value;try{localStorage.setItem('higherLowerTheme',els.theme.value)}catch(e){}});
try{best=Number(localStorage.getItem(BEST_KEYS[mode])||0);const t=localStorage.getItem('higherLowerTheme');if(t&&['classic','cyber','cosmic'].includes(t)){els.theme.value=t;document.body.dataset.theme=t}}catch(e){}setMode(els.mode.value);els.best.textContent=best;updateDeck();updateJoker();
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
})();
</script>
</body></html>
