<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e9e6df"><title>Sudoku – By Alp</title>
<style>
:root{--bg:#e9e6df;--paper:#faf9f5;--ink:#30332e;--muted:#7c8177;--sage:#71836c;--sage2:#e5ebdf;--blue:#dce8f5;--red:#c94e4e;--line:#d8d8ce}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:min(100%,480px);height:100dvh;min-height:0;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(5px,1.1vh,10px);align-items:stretch}
header{display:flex;justify-content:center;align-items:center;flex:none}
h1{font-size:clamp(25px,7vw,34px);line-height:1;margin:0;font-weight:850;letter-spacing:-1.4px}.brand{font-size:10px;font-weight:750;letter-spacing:.16em;color:var(--muted)}
.topstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}.stat{background:var(--paper);border:1px solid #dfdfd5;border-radius:12px;padding:6px 5px;text-align:center;color:var(--muted);font-size:9px;letter-spacing:.07em}.stat b{display:block;color:var(--ink);font-size:clamp(15px,4vw,19px);font-variant-numeric:tabular-nums;letter-spacing:0}.time-toggle{width:100%;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:0}.pause-label{display:block;font-size:8px;letter-spacing:.08em;color:var(--sage);min-height:10px;margin-top:1px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.toolbar label{font-size:11px;color:var(--muted);font-weight:650}.toolbar select{border:1px solid #d5d8cd;border-radius:10px;background:var(--paper);padding:7px 10px;color:var(--ink);font:650 12px system-ui;max-width:190px}
.progress{height:5px;background:#d9dcd2;border-radius:9px;overflow:hidden;flex:none}.progress span{height:100%;display:block;width:0;background:var(--sage);transition:width .2s}
.board-wrap{width:min(100%,calc(100dvh - 300px));max-width:440px;aspect-ratio:1;align-self:center;flex:none;display:flex;align-items:center;justify-content:center}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);background:var(--paper);border:2px solid #737c6c;border-radius:9px;overflow:hidden;box-shadow:0 8px 24px #515b4510}
.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;font:500 clamp(15px,4.8vw,23px) system-ui;position:relative;padding:0;min-width:0;min-height:0;touch-action:manipulation}
.cell:nth-child(3n){border-right:2px solid #89917f}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #89917f}.cell:nth-child(n+73){border-bottom:0}
.cell.fixed{font-weight:750}.cell.related{background:#f0f1e9}.cell.same{background:#e4eadf}.cell.selected{background:var(--blue)!important;box-shadow:inset 0 0 0 2px #7898b7;z-index:1}.cell.error{color:var(--red)!important;background:#f9e9e6}.cell .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(6px,1.8vw,9px);line-height:1;color:#7d8877;font-weight:500}
.actions{display:flex;gap:7px;flex:none}.btn{border:0;border-radius:11px;padding:9px 10px;background:var(--sage);color:white;font:700 12px system-ui;flex:1;touch-action:manipulation}.btn.light{background:#dfe3d9;color:var(--ink)}.btn:active,.num:active{transform:scale(.97)}
.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;flex:none}.num{height:clamp(39px,7vh,49px);border:1px solid #d9ddd2;border-radius:10px;background:var(--paper);color:var(--ink);font:700 clamp(16px,4vw,20px) system-ui;touch-action:manipulation}.num:disabled{opacity:.32}
.tools{display:flex;gap:6px;flex:none}.tools button{border:1px solid #d8dbd1;border-radius:10px;background:#f5f5ef;color:#535a4f;padding:8px 4px;font:650 10px system-ui;flex:1;touch-action:manipulation}
footer{text-align:center;color:#92968c;font-size:10px;font-weight:700;letter-spacing:.13em;flex:none;margin-top:auto;padding-top:1px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,12px);background:#303a30;color:white;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:650;opacity:0;pointer-events:none;transition:.2s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.win{position:fixed;inset:0;background:#283326b8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.win.hidden{display:none}.win-card{background:var(--paper);border-radius:22px;padding:26px 22px;text-align:center;width:min(100%,330px);box-shadow:0 18px 60px #0003;animation:pop .35s ease-out}.win-card h2{margin:0 0 8px;font-size:27px}.win-card p{color:var(--muted);font-size:13px;line-height:1.5}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media(max-height:700px){.app{gap:4px;padding-top:5px;padding-bottom:5px}.board-wrap{width:min(100%,calc(100dvh - 275px))}.stat{padding:4px}.num{height:36px}.cell{font-size:clamp(14px,4.4vw,20px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Einheitliches NFC-Arcade / Mastermind-Design – reine Darstellung */
:root{--brand-bg:#171717;--brand-panel:#242424;--brand-edge:#555;--brand-cream:#f1eadb;--brand-muted:#aaa;--brand-gold:#d8b66a}
html,body{background:radial-gradient(ellipse at 50% 0,#333 0,#171717 65%)!important;color:var(--brand-cream)!important}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif!important}
.app{color:var(--brand-cream)}
h1{font-family:Georgia,serif!important;color:#e7d7b3!important;text-shadow:0 2px 0 #6b5836!important;letter-spacing:.12em!important}
h2{font-family:Georgia,serif;color:#e8d8b5}
.panel,.stat,.stat,.settings,.side .panel,.theme-preview-wrap{background:linear-gradient(145deg,#2b2b2b,#202020)!important;border:1px solid #555!important;color:#c4bba9!important;box-shadow:0 4px 0 #090909}
button,.btn,.miniAction,.sound,.sprint{border:1px solid #8d7955!important;border-radius:10px!important;background:linear-gradient(#d7bd83,#a88a53)!important;color:#211b12!important;font-weight:800!important;box-shadow:0 3px 0 #100e0b!important}
button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #100e0b!important}
button:disabled{opacity:.4}
select{border:1px solid #666!important;border-radius:9px!important;background:#171717!important;color:#f4ead6!important}
footer,.byline,.sub.byline{display:block;text-align:center;color:#aaa!important;font-size:10px!important;font-weight:700!important;letter-spacing:.16em!important;text-transform:none!important;margin-top:auto!important;padding:8px 0 max(4px,env(safe-area-inset-bottom))!important}

:root{--bg:#171717!important;--paper:#242424!important;--ink:#f1eadb!important;--muted:#aaa!important;--sage:#d8b66a!important;--sage2:#3a3326!important;--blue:#343434!important;--line:#555!important}
body{background:radial-gradient(ellipse at 50% 0,#333 0,#171717 65%)!important}
.app{background:transparent}
.stat{background:#222!important;border-color:#4d4d4d!important;color:#aaa!important}.stat b{color:#f3e8d2!important}
.toolbar label{color:#c4bba9!important}
.board-wrap,.board{border-color:#666!important}
.cell{background:#242424!important;color:#f1eadb!important;border-color:#555!important}
.board{border:2px solid #b89a62!important;gap:0!important}
.cell{border-right:1px solid #555!important;border-bottom:1px solid #555!important}
.cell:nth-child(3n){border-right:3px solid #b89a62!important}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #b89a62!important}

.cell:nth-child(n+73){border-bottom:0!important}

.cell.selected,.cell.related{background:#55472d!important}
/* Aktive Zelle: heller Goldton und klarer Innenrahmen, auch am unteren Rasterrand gut erkennbar. */
.cell.selected{background:#75613d!important;box-shadow:inset 0 0 0 3px #f0d38c, inset 0 0 13px #f0d38c55!important;z-index:2;filter:brightness(1.2)}
footer{margin-top:auto!important}


/* NFC ARCADE — gemeinsames Finish: Typografie, Oberflächen, Dialoge und Bedienzustände */
:root{
 --arc-bg:#171717;--arc-surface:#252525;--arc-surface-hi:#303030;--arc-border:#595959;
 --arc-gold:#d8b66a;--arc-gold-hi:#ead39c;--arc-text:#f1eadb;--arc-muted:#aaa397;
 --arc-shadow:0 4px 0 #0b0b0b,0 8px 18px #0003;
 color-scheme:dark;
}
html{scrollbar-color:#766344 #171717;scrollbar-width:thin}
body{color:var(--arc-text)!important;accent-color:var(--arc-gold)}
::selection{background:#d8b66a55;color:#fff}
:focus-visible{outline:2px solid var(--arc-gold-hi)!important;outline-offset:3px}
button,.btn,select,input,textarea{font:inherit}
button,.btn{
 transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;
}
button:hover:not(:disabled),.btn:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled),.btn:active:not(:disabled){filter:brightness(.96)}
button:disabled,.btn:disabled{cursor:not-allowed;filter:saturate(.45);opacity:.48}
input:not([type=checkbox]):not([type=radio]),select,textarea{
 background:#191919!important;color:var(--arc-text)!important;border:1px solid #68604f!important;
 border-radius:9px!important;box-shadow:inset 0 1px 3px #0008!important;
}
input::placeholder,textarea::placeholder{color:#827d73!important}
.panel,.stat,.settings,.side .panel,.theme-preview-wrap,.result,.win-card,.dialog{
 background:linear-gradient(145deg,#303030,#202020)!important;
 border:1px solid var(--arc-border)!important;border-radius:13px!important;
 box-shadow:var(--arc-shadow)!important;color:#d8d0c2!important;
}
h1,h2,h3{ text-wrap:balance }
h2,h3{color:#e8d8b5}
.stat,.statsPanel,.note,.message,.help,.hint,.gesture-hint{color:var(--arc-muted)}
hr{border:0;border-top:1px solid #5b4b30}
a{color:var(--arc-gold-hi)}
.overlay,.modal,.win{
 background:#101010df!important;backdrop-filter:blur(7px);
}
.overlay h2,.modal h2,.win h2,.result h2{color:#ead8ae!important;font-family:Georgia,serif!important}
footer,.byline{color:#aaa!important}
@media(hover:none){button:hover:not(:disabled),.btn:hover:not(:disabled){filter:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}


/* Deutlichere 3x3-Blockgrenzen im Sudoku-Raster. */
.cell:nth-child(3n){border-right:4px solid #d8b66a!important}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){border-bottom:4px solid #d8b66a!important}
/* Hinweis: erster Tipp schaltet in einen klar erkennbaren Bestätigungszustand. */
#hint.hint-armed{
 background:#fff!important;color:#211b12!important;border:2px solid #d8b66a!important;
 box-shadow:0 0 0 3px #d8b66a55,0 3px 0 #100e0b!important;
}

/* Sudoku: Zahlenfeld bekommt dieselbe Gold-Bedienoptik; Rasterfarben bleiben erhalten. */
.numbers button,.num{border:1px solid #8d7955!important;border-radius:9px!important;background:linear-gradient(#d7bd83,#a88a53)!important;color:#211b12!important;box-shadow:0 2px 0 #100e0b!important}
.cell{transition:background-color .12s ease}

</style></head><body><main class="app">
<header><h1>Sudoku.</h1></header>
<section class="topstats"><div class="stat"><button class="time-toggle" id="timeToggle" type="button" aria-label="Timer pausieren">ZEIT<b id="timer">00:00</b><span class="pause-label" id="pauseLabel">TIPPE ZUM PAUSIEREN</span></button></div><div class="stat">FEHLER<b id="mistakes">0 / 3</b></div><div class="stat">BESTZEIT<b id="best">—</b></div></section>
<div class="toolbar"><label for="difficulty">SCHWIERIGKEIT</label><select id="difficulty"><option value="0">Anfänger</option><option value="1" selected>Einfach</option><option value="2">Mittel</option><option value="3">Schwer</option><option value="4">Meister</option></select><button class="btn light" id="new">Neues Rätsel</button></div>
<div class="progress"><span id="progress"></span></div>
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Sudoku-Spielfeld"></div></div>
<div class="numbers" id="numbers"></div>
<div class="actions"><button class="btn light" id="erase">⌫ Löschen</button><button class="btn" id="hint">Hinweis</button></div>
<footer>by Alp</footer></main>
<div class="toast" id="toast"></div>
<div class="win hidden" id="win"><div class="win-card"><h2 id="win-card-title">Wunderbar gelöst!</h2><p id="wintext"></p><button class="btn" id="winnew">Neues Sudoku</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),boardEl=$('board'),difficulty=$('difficulty');
let solution=[],puzzle=[],values=[],fixed=[],selected=-1,mistakes=0,seconds=0,completed=false,tick=null,toastTimer=null,clockPaused=false,hintArmed=false;
const targets=[28,36,45,52,58],names=['Anfänger','Einfach','Mittel','Schwer','Meister'];
function maxMistakes(){const level=Number(difficulty.value);return [10,7,5,3,1][level]??10}
function hintsDisabled(){return Number(difficulty.value)>=3}
function updateHintControl(){const b=$('hint');b.disabled=hintsDisabled();b.textContent=hintsDisabled()?'Hinweis deaktiviert':'Hinweis';b.classList.remove('hint-armed');hintArmed=false}
const key='sudokuByAlpSaveV1';
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pattern(r,c){return (r*3+Math.floor(r/3)+c)%9}
function solvedGrid(){let rows=shuffle([0,1,2]).flatMap(g=>shuffle([0,1,2]).map(x=>g*3+x));let cols=shuffle([0,1,2]).flatMap(g=>shuffle([0,1,2]).map(x=>g*3+x));let nums=shuffle([1,2,3,4,5,6,7,8,9]);return rows.map(r=>cols.map(c=>nums[pattern(r,c)]))}
function countSolutions(g,limit=2){let count=0;function solve(){let best=-1,opts=null;for(let i=0;i<81;i++)if(!g[Math.floor(i/9)][i%9]){let r=Math.floor(i/9),c=i%9,used=new Set([...g[r],...g.map(row=>row[c]),...g.slice(Math.floor(r/3)*3,Math.floor(r/3)*3+3).flatMap(row=>row.slice(Math.floor(c/3)*3,Math.floor(c/3)*3+3))]);let o=[1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n));if(!opts||o.length<opts.length){best=i;opts=o;if(o.length===0)break;if(o.length===1)break}}if(best<0){count++;return count>=limit}let r=Math.floor(best/9),c=best%9;for(const n of opts){g[r][c]=n;if(solve())return true;g[r][c]=0}return false}solve();return count}
function makePuzzle(level){disarmHint();solution=solvedGrid();puzzle=solution.map(r=>r.slice());let indices=shuffle(Array.from({length:81},(_,i)=>i)),removed=0,target=targets[level];for(const i of indices){if(removed>=target)break;let r=Math.floor(i/9),c=i%9,old=puzzle[r][c];puzzle[r][c]=0;if(countSolutions(puzzle.map(row=>row.slice()))===1)removed++;else puzzle[r][c]=old}values=puzzle.flat();fixed=values.map(v=>v!==0);mistakes=0;seconds=0;selected=-1;completed=false;clockPaused=false;startClock();save();render()}
function render(){boardEl.innerHTML='';for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,v=values[i],el=document.createElement('button');el.className='cell'+(fixed[i]?' fixed':'');el.type='button';el.setAttribute('role','gridcell');el.setAttribute('aria-label','Zeile '+(r+1)+', Spalte '+(c+1)+(v?', Zahl '+v:' leer'));if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))el.classList.add('related');if(i===selected)el.classList.add('selected');if(v&&v===values[selected])el.classList.add('same')}if(v){el.textContent=v;if(!fixed[i]&&isWrong(i))el.classList.add('error')}el.addEventListener('click',()=>{disarmHint();selected=i;render()});boardEl.append(el)}$('mistakes').textContent=mistakes+' / '+maxMistakes();updateHintControl();let done=values.filter(Boolean).length;$('progress').style.width=(done/81*100)+'%';document.querySelectorAll('.num').forEach(b=>{let n=Number(b.dataset.n),left=values.filter(v=>v===n).length;b.disabled=left>=9;b.style.opacity=left>=9?'.35':'1'})}
function isWrong(i){let r=Math.floor(i/9),c=i%9;return values[i]!==solution[r][c]}
function input(n){disarmHint();if(selected<0||fixed[selected]||completed)return;values[selected]=n;let wrong=isWrong(selected);if(wrong){mistakes++;showToast('Diese Zahl stimmt leider nicht.')}save();render();if(wrong&&mistakes>maxMistakes()){loseGame();return}if(values.every((v,i)=>v===solution[Math.floor(i/9)][i%9]))winGame()}
function clearCell(){if(selected<0||fixed[selected]||completed)return;values[selected]=0;save();render()}
function disarmHint(){hintArmed=false;const b=$('hint');b.classList.remove('hint-armed');b.textContent='Hinweis'}
function hint(){if(hintsDisabled()){disarmHint();showToast('Hinweise sind im schweren Modus deaktiviert.');return}if(selected<0){disarmHint();showToast('Wähle zuerst ein Feld aus.');return}if(fixed[selected]){disarmHint();showToast('Diese Zahl ist bereits vorgegeben.');return}if(!hintArmed){hintArmed=true;$('hint').classList.add('hint-armed');$('hint').textContent='NOCHMAL TIPPEN';return}disarmHint();values[selected]=solution[Math.floor(selected/9)][selected%9];save();render();if(values.every((v,i)=>v===solution[Math.floor(i/9)][i%9]))winGame()}
function showToast(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function startClock(){clearInterval(tick);tick=setInterval(()=>{if(!completed&&!clockPaused){seconds++;$('timer').textContent=formatTime(seconds);save()}},1000);$('timer').textContent=formatTime(seconds);updateClockControl()}
function updateClockControl(){$('pauseLabel').textContent=clockPaused?'PAUSIERT · TIPPE ZUM FORTSETZEN':'TIPPE ZUM PAUSIEREN';$('timeToggle').setAttribute('aria-label',clockPaused?'Timer fortsetzen':'Timer pausieren')}
function toggleClock(){if(completed)return;clockPaused=!clockPaused;updateClockControl();showToast(clockPaused?'Zeitmessung pausiert':'Zeitmessung läuft weiter')}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function bestKey(){return 'sudokuBest_'+difficulty.value}
function loadBest(){let b=Number(localStorage.getItem(bestKey())||0);$('best').textContent=b?formatTime(b):'—'}
function save(){try{localStorage.setItem(key,JSON.stringify({puzzle,values,mistakes,seconds,level:difficulty.value,solution}))}catch(e){}}
function restore(){try{let s=JSON.parse(localStorage.getItem(key));if(!s||s.level!==difficulty.value||!Array.isArray(s.values)||s.values.length!==81)return false;puzzle=s.puzzle;values=s.values;solution=s.solution;fixed=puzzle.map(v=>v!==0);mistakes=s.mistakes||0;seconds=s.seconds||0;completed=false;clockPaused=false;selected=-1;startClock();render();return true}catch(e){return false}}
function loseGame(){completed=true;clockPaused=false;clearInterval(tick);$('win-card-title').textContent='Spiel vorbei';$('wintext').textContent='Du hast die maximale Fehleranzahl von '+maxMistakes()+' erreicht. Starte ein neues Sudoku und versuche es erneut.';$('winnew').textContent='Neues Sudoku';$('win').classList.remove('hidden');save()}
function winGame(){completed=true;clockPaused=false;clearInterval(tick);$('win-card-title').textContent='Wunderbar gelöst!';$('winnew').textContent='Neues Sudoku';let b=Number(localStorage.getItem(bestKey())||0);if(!b||seconds<b){localStorage.setItem(bestKey(),String(seconds));b=seconds}loadBest();$('wintext').textContent='Du hast das '+names[Number(difficulty.value)]+'-Sudoku in '+formatTime(seconds)+' gelöst – mit '+mistakes+' Fehlern. '+(seconds===b?'Neue Bestzeit!':'Deine Bestzeit: '+formatTime(b)+'.');$('win').classList.remove('hidden');save()}
function newGame(){difficulty.value=difficulty.value;loadBest();makePuzzle(Number(difficulty.value))}
$('numbers').innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num';b.textContent=n;b.dataset.n=n;b.addEventListener('click',()=>input(n));$('numbers').append(b)}
$('new').addEventListener('click',newGame);$('erase').addEventListener('click',()=>{disarmHint();clearCell()});$('hint').addEventListener('click',hint);$('timeToggle').addEventListener('click',toggleClock);$('winnew').addEventListener('click',()=>{$('win').classList.add('hidden');newGame()});difficulty.addEventListener('change',()=>{loadBest();newGame()});
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')input(Number(e.key));if(e.key==='Backspace'||e.key==='Delete')clearCell();if(e.key.startsWith('Arrow')&&selected>=0){e.preventDefault();let r=Math.floor(selected/9),c=selected%9;if(e.key==='ArrowUp')r=Math.max(0,r-1);if(e.key==='ArrowDown')r=Math.min(8,r+1);if(e.key==='ArrowLeft')c=Math.max(0,c-1);if(e.key==='ArrowRight')c=Math.min(8,c+1);selected=r*9+c;render()}});
if(!restore()){loadBest();makePuzzle(Number(difficulty.value))}else loadBest();
})();
</script></body></html>
