<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>Tetris – By Alp</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#f4f4f4;color:#111;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:stretch;justify-content:center;padding:0 8px}
.app{width:min(100%,440px);height:100dvh;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;gap:3px;padding:5px 0}
h1{font-size:33px;line-height:1.05;letter-spacing:-1.5px;margin:0;font-weight:850}
.sub{color:#777;margin:0 0 3px;font-size:13px;font-weight:650;letter-spacing:.04em}
.stats{width:min(100%,380px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:2px 0 5px}
.stat{background:#fff;border:1px solid #e7e7e7;border-radius:11px;padding:5px 3px;color:#888;font-size:10px}
.stat b{display:block;color:#111;font-size:17px;font-variant-numeric:tabular-nums}
.play-area{display:flex;align-items:flex-start;justify-content:center;gap:9px;width:100%}
.board-wrap{position:relative;height:min(145vw,calc(100dvh - 245px),720px);width:auto;max-width:calc(100vw - 120px);aspect-ratio:1/2;flex:0 1 auto;min-height:0}
canvas#board{width:100%;height:100%;display:block;background:#090b14;border:1px solid #25283a;border-radius:13px;box-shadow:0 8px 28px #00000018;touch-action:none}
.side{width:82px;display:flex;flex-direction:column;gap:7px}
.panel{background:#fff;border:1px solid #e7e7e7;border-radius:11px;padding:7px 4px;color:#888;font-size:10px}
#next{width:72px;height:72px;display:block;margin:4px auto 0;background:#090b14;border-radius:7px}
.level-val{display:block;color:#111;font-size:19px;font-weight:800;margin-top:2px}
.actions{display:flex;gap:8px;width:min(100%,380px);margin-top:5px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:750;font-size:14px;background:#111;color:#fff;flex:1;touch-action:manipulation}
.btn.secondary{background:#e8e8e8;color:#111}
.gesture-hint{color:#999;font-size:10px;margin:8px auto 0;touch-action:none}
footer{color:#999;font-size:11px;font-weight:650;letter-spacing:.04em;margin-top:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#090b14d9;border-radius:13px;color:white;font-weight:800;font-size:24px;gap:5px}
.overlay small{font-size:12px;color:#c5c9df;font-weight:600}
.hidden{display:none!important}
@media(max-height:740px){
.app{gap:1px;padding:3px 0}
h1{font-size:29px}
.stats{margin:0 0 2px}
.actions{margin-top:2px}
.gesture-hint{margin-top:4px}
.sub{margin-bottom:0}
.board-wrap{height:min(145vw,calc(100dvh - 245px),720px)}
.side{width:76px;gap:5px}
.panel{padding:6px 3px;font-size:9px}
#next{width:64px;height:64px}
}
@media(max-width:360px){
.play-area{gap:6px}
.side{width:70px}
.board-wrap{height:min(calc(100vw - 100px),calc(100dvh - 245px),720px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Einheitliches NFC-Arcade / Mastermind-Design – reine Darstellung */
:root{--brand-bg:#171717;--brand-panel:#242424;--brand-edge:#555;--brand-cream:#f1eadb;--brand-muted:#aaa;--brand-gold:#d8b66a}
html,body{background:radial-gradient(ellipse at 50% 0,#333 0,#171717 65%)!important;color:var(--brand-cream)!important}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif!important}
.app{color:var(--brand-cream)}
h1{font-family:Georgia,serif!important;color:#e7d7b3!important;text-shadow:0 2px 0 #6b5836!important;letter-spacing:.12em!important}
h2{font-family:Georgia,serif;color:#e8d8b5}
.panel,.stat,.stat,.settings,.side .panel,.theme-preview-wrap{background:linear-gradient(145deg,#2b2b2b,#202020)!important;border:1px solid #555!important;color:#c4bba9!important;box-shadow:0 4px 0 #090909}
button,.btn,.miniAction,.sound,.sprint{border:1px solid #8d7955!important;border-radius:10px!important;background:linear-gradient(#d7bd83,#a88a53)!important;color:#211b12!important;font-weight:800!important;box-shadow:0 3px 0 #100e0b!important}
button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #100e0b!important}
button:disabled{opacity:.4}
select{border:1px solid #666!important;border-radius:9px!important;background:#171717!important;color:#f4ead6!important}
footer,.byline,.sub.byline{display:block;text-align:center;color:#aaa!important;font-size:10px!important;font-weight:700!important;letter-spacing:.16em!important;text-transform:none!important;margin-top:auto!important;padding:8px 0 max(4px,env(safe-area-inset-bottom))!important}

body{padding:8px 10px 4px!important}.app{justify-content:space-evenly!important}
.stats .stat{background:#222!important;border-color:#4d4d4d!important;color:#aaa!important}.stat b,.level-val{color:#f3e8d2!important}
canvas#board,#next{border:2px solid #626262!important;border-radius:12px!important;box-shadow:inset 0 2px 8px #0008,0 4px 0 #090909!important}
.overlay{background:#171717df!important;color:#e8d8b5!important}
.panel{background:linear-gradient(145deg,#2b2b2b,#202020)!important}
.gesture-hint{color:#aaa!important}footer{margin-top:auto!important}

</style>
</head>
<body>
<main class="app">
<h1>Tetris.</h1>
<div class="stats">
 <div class="stat">PUNKTE<b id="score">0</b></div>
 <div class="stat">HIGHSCORE<b id="best">0</b></div>
 <div class="stat">LINIEN<b id="lines">0</b></div>
</div>
<div class="play-area">
 <div class="board-wrap"><canvas id="board" width="300" height="600"></canvas><div class="overlay" id="overlay"><span id="overlayTitle">TETRIS</span><small id="overlayText">Drücke Start zum Spielen</small></div></div>
 <aside class="side">
  <div class="panel">NÄCHSTER STEIN<canvas id="next" width="120" height="120"></canvas></div>
  <div class="panel">LEVEL<span class="level-val" id="level">1</span></div>
  <div class="panel">SCHWIERIGKEIT<select id="difficulty" aria-label="Schwierigkeit" style="display:block;width:100%;margin:6px auto 0;border:1px solid #ddd;border-radius:8px;background:#fff;padding:5px 3px;font:600 11px system-ui;color:#222"><option value="easy">Einfach</option><option value="normal" selected>Normal</option><option value="hard">Schwer</option></select></div>
 </aside>
</div>
<div class="actions"><button class="btn" id="start">Start</button><button class="btn secondary" id="reset">Neustart</button></div>
<div class="gesture-hint">Wischen: bewegen · Tippen: drehen</div>
<footer>by Alp</footer>

</main>
<script>
(()=>{
const W=10,H=20,S=30,canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
const $=id=>document.getElementById(id),difficultyEl=$('difficulty');
const shapes={
 I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
};
const colors={I:'#36e7ff',O:'#ffe34d',T:'#c56bff',S:'#55f28c',Z:'#ff557c',J:'#5887ff',L:'#ff9b45'};
let grid,piece,next,score,lines,level,best,active=false,paused=false,over=false,loop=null,last=0,dropCounter=0,mode=difficultyEl.value,clearFx=null;
const modes={easy:{label:'Einfach',base:1120,step:55,min:180},normal:{label:'Normal',base:850,step:65,min:120},hard:{label:'Schwer',base:650,step:58,min:85}};
function bestKey(){return 'tetrisBest_'+mode}
function freshPiece(type){return {type,m:shapes[type].map(r=>r.slice()),x:Math.floor((W-shapes[type][0].length)/2),y:0}}
function randomType(){return Object.keys(shapes)[Math.floor(Math.random()*7)]}
function loadBest(){best=Number(localStorage.getItem(bestKey())||0);$('best').textContent=best}
function updateStats(){$('score').textContent=score;$('lines').textContent=lines;$('level').textContent=level;if(score>best){best=score;localStorage.setItem(bestKey(),best);$('best').textContent=best}}
function reset(){stop();clearFx=null;grid=Array.from({length:H},()=>Array(W).fill(''));score=0;lines=0;level=1;piece=freshPiece(randomType());next=freshPiece(randomType());active=false;paused=false;over=false;dropCounter=0;$('start').textContent='Start';$('overlayTitle').textContent='TETRIS';$('overlayText').textContent='Drücke Start zum Spielen';$('overlay').classList.remove('hidden');updateStats();draw();drawNext()}
function stop(){if(loop!==null)cancelAnimationFrame(loop);loop=null}
function start(){if(over)reset();if(active){paused=true;active=false;stop();$('start').textContent='Weiter';$('overlayTitle').textContent='PAUSE';$('overlayText').textContent='Tippe auf Weiter';$('overlay').classList.remove('hidden');return}paused=false;active=true;$('start').textContent='Pause';$('overlay').classList.add('hidden');last=0;loop=requestAnimationFrame(frame)}
function frame(t){if(!active)return;if(!last)last=t;const delta=t-last;last=t;dropCounter+=delta;if(dropCounter>Math.max(modes[mode].min,modes[mode].base-(level-1)*modes[mode].step)){drop();dropCounter=0}draw();loop=requestAnimationFrame(frame)}
function collide(p=piece,ox=0,oy=0,m=p.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const nx=p.x+x+ox,ny=p.y+y+oy;if(nx<0||nx>=W||ny>=H||(ny>=0&&grid[ny][nx]))return true}return false}
function move(dx){if(!active)return;if(!collide(piece,dx,0))piece.x+=dx;draw()}
function rotate(){if(!active)return;const m=piece.m[0].map((_,i)=>piece.m.map(row=>row[i]).reverse());for(const kick of [0,-1,1,-2,2])if(!collide(piece,0,0,m)){piece.m=m;piece.x+=kick;break}draw()}
function drop(){if(!active)return;if(!collide(piece,0,1)){piece.y++;return}lock()}
function hardDrop(){if(!active)return;while(!collide(piece,0,1))piece.y++;lock()}
function lock(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}));let cleared=0,clearedRows=[];for(let y=H-1;y>=0;y--)if(grid[y].every(Boolean)){clearedRows.push(y);grid.splice(y,1);grid.unshift(Array(W).fill(''));cleared++;y++}if(cleared){clearFx={rows:clearedRows.slice(),start:performance.now(),duration:240};const pts=[0,100,300,500,800][cleared]||800;score+=pts*level;lines+=cleared;level=Math.floor(lines/10)+1;updateStats()}piece=next;piece.x=Math.floor((W-piece.m[0].length)/2);piece.y=0;next=freshPiece(randomType());drawNext();if(collide(piece)){gameOver()}}
function gameOver(){active=false;over=true;stop();$('start').textContent='Nochmal';$('overlayTitle').textContent='GAME OVER';$('overlayText').textContent='Punkte: '+score+' · Tippe auf Nochmal';$('overlay').classList.remove('hidden')}
function drawBlock(c,x,y,size,glow=true){if(!c)return;c.fillStyle=colors[x.type]||'#fff';}
function draw(){ctx.clearRect(0,0,300,600);ctx.fillStyle='#090b14';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#171b2b';ctx.lineWidth=1;for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])block(ctx,x,y,colors[grid[y][x]]);if(piece){const ghost={...piece};while(!collide(ghost,0,1))ghost.y++;piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){block(ctx,piece.x+x,piece.y+y,colors[piece.type]);}}));ghost.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){const px=ghost.x+x,py=ghost.y+y;if(py>=0&&!grid[py][px]){ctx.strokeStyle=colors[ghost.type]+'88';ctx.lineWidth=1.5;ctx.strokeRect(px*S+4,py*S+4,S-8,S-8)}}}))}if(clearFx){const elapsed=performance.now()-clearFx.start;if(elapsed<clearFx.duration){const p=elapsed/clearFx.duration,alpha=Math.sin(p*Math.PI)*.72;clearFx.rows.forEach(row=>{ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor='#b9f7ff';ctx.shadowBlur=18;ctx.fillStyle='#d9fbff';ctx.fillRect(2,row*S+2,296,S-4);const sweepX=-90+p*390;const grad=ctx.createLinearGradient(sweepX-45,0,sweepX+45,0);grad.addColorStop(0,'rgba(255,255,255,0)');grad.addColorStop(.5,'rgba(255,255,255,.95)');grad.addColorStop(1,'rgba(255,255,255,0)');ctx.globalAlpha=alpha;ctx.fillStyle=grad;ctx.fillRect(2,row*S+2,296,S-4);ctx.restore()})}else clearFx=null}}
function block(c,x,y,color){c.save();c.shadowColor=color;c.shadowBlur=9;c.fillStyle=color;c.fillRect(x*S+2,y*S+2,S-4,S-4);c.shadowBlur=0;c.fillStyle='#ffffff55';c.fillRect(x*S+4,y*S+4,S-8,3);c.restore()}
function drawNext(){nctx.clearRect(0,0,120,120);nctx.fillStyle='#090b14';nctx.fillRect(0,0,120,120);const m=next.m,sz=22,ox=(120-m[0].length*sz)/2,oy=(120-m.length*sz)/2;m.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.save();nctx.shadowColor=colors[next.type];nctx.shadowBlur=9;nctx.fillStyle=colors[next.type];nctx.fillRect(ox+x*sz+2,oy+y*sz+2,sz-4,sz-4);nctx.restore()}}))}
function action(d){if(d==='left')move(-1);if(d==='right')move(1);if(d==='up')rotate();if(d==='down')drop()}
let gestureStart=null;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();gestureStart={x:e.clientX,y:e.clientY};try{canvas.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
canvas.addEventListener('pointerup',e=>{if(!gestureStart)return;const dx=e.clientX-gestureStart.x,dy=e.clientY-gestureStart.y;gestureStart=null;const ax=Math.abs(dx),ay=Math.abs(dy);if(Math.max(ax,ay)<18){rotate();return}if(ax>ay){const steps=Math.max(1,Math.floor(ax/38));for(let i=0;i<steps;i++)move(dx<0?-1:1)}else if(dy>0){const steps=Math.max(2,Math.floor(dy/24));for(let i=0;i<steps;i++){if(!active)break;if(!collide(piece,0,1))piece.y++;else{lock();break}}draw()}},{passive:false});
canvas.addEventListener('pointercancel',()=>{gestureStart=null});
$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);
difficultyEl.addEventListener('change',()=>{mode=difficultyEl.value;loadBest();reset()});
document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'up',' ':'space'};const d=map[e.key];if(d){e.preventDefault();if(d==='space')hardDrop();else action(d)}if(e.key==='Enter'&&!active)start()});

loadBest();reset();
})();
</script>
</body></html>
