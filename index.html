<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f4f4">
<title>NFC Arcade – Snake by Alp</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}body{background:#f4f4f4;color:#111;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;padding:10px}.app{width:min(100%,440px);max-height:100dvh;text-align:center;display:flex;flex-direction:column;justify-content:center}.top{display:flex;justify-content:space-between;align-items:center;margin:3px 0 6px}.brand{font-weight:900;letter-spacing:.12em;font-size:12px;color:#777}.scores{display:flex;gap:16px;font-size:10px;color:#666}.scores b{display:block;color:#111;font-size:19px}.scores b.pop{animation:scorePop .28s ease-out}@keyframes scorePop{0%{transform:scale(1)}45%{transform:scale(1.35);color:#ef3340}100%{transform:scale(1)}}@keyframes boardIn{0%{opacity:0;transform:scale(.94)}65%{opacity:1;transform:scale(1.015)}100%{opacity:1;transform:scale(1)}}@keyframes boardOut{0%{opacity:1;transform:scale(1)}100%{opacity:.65;transform:scale(.97)}}canvas.new-round{animation:boardIn .42s cubic-bezier(.2,.8,.2,1)}canvas.game-over{animation:boardOut .35s ease-out}h1{font-size:33px;margin:2px 0 0;letter-spacing:-1.5px;line-height:1.1}.sub{color:#777;margin:1px 0 7px;font-size:13px;font-weight:650;letter-spacing:.04em}.settings{display:flex;justify-content:center;align-items:center;gap:7px;margin:0 0 8px;font-size:11px;color:#777}.settings select{border:1px solid #ddd;border-radius:9px;background:#fff;padding:5px 9px;font:600 12px system-ui;color:#222}canvas{width:100%;height:auto;display:block;background:#fff;border:1px solid #e4e4e4;border-radius:16px;box-shadow:0 8px 30px #0000000b;touch-action:none}.actions{display:flex;gap:9px;margin-top:9px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;font-size:14px;background:#111;color:#fff;flex:1;touch-action:manipulation}.btn.secondary{background:#e8e8e8;color:#111}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:186px;margin:10px auto 0}.pad button{height:43px;border:0;border-radius:11px;background:#e8e8e8;font-size:20px;font-weight:800;color:#111;touch-action:manipulation}.empty{visibility:hidden}.hint{color:#999;font-size:10px;margin:8px 0 0}@media(prefers-reduced-motion:reduce){canvas.new-round,canvas.game-over,.scores b.pop{animation:none}}
</style></head><body><main class="app">
<div class="top"><div class="brand">NFC ARCADE</div><div class="scores"><div>PUNKTE<b id="score">0</b></div><div>HIGHSCORE<b id="best">0</b></div></div></div>
<h1>Snake.</h1><p class="sub">By Alp</p>
<div class="settings"><label for="difficulty">Schwierigkeit</label><select id="difficulty"><option value="easy">Einfach</option><option value="normal" selected>Normal</option><option value="hard">Schwer</option></select><span id="modeHint">● Normal</span></div>
<canvas id="game" width="600" height="480" aria-label="Snake Spielfeld"></canvas>
<div class="actions"><button class="btn" id="start">Start</button><button class="btn secondary" id="reset">Neustart</button></div>
<div class="pad"><span class="empty"></span><button data-dir="up" aria-label="Hoch">↑</button><span class="empty"></span><button data-dir="left" aria-label="Links">←</button><button data-dir="down" aria-label="Runter">↓</button><button data-dir="right" aria-label="Rechts">→</button></div>
<p class="hint">Steuerung: Tasten, Wischen oder Tastatur · 15 × 12 Raster</p>
</main><script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startBtn=document.getElementById('start'),difficultyEl=document.getElementById('difficulty'),modeHint=document.getElementById('modeHint'),cols=15,rows=12,cell=40;
const modes={easy:{label:'Einfach',speed:174,step:2.5},normal:{label:'Normal',speed:152.25,step:3.15},hard:{label:'Schwer',speed:126,step:2.6}};
let snake,food,dir,next,score,best,timer=null,countdownTimer=null,foodTimer=null,slowTimer=null,running=false,paused=false,over=false,countdown=0,specialUntil=0,slowUntil=0,particles=[],mode=difficultyEl.value;
const palettes=['#242424','#2563a6','#168477','#8055a5','#c46b25','#54833c'];
function bestKey(){return 'snakeBest_'+mode}
function loadBest(){try{best=Number(localStorage.getItem(bestKey())||0)}catch(e){best=0}bestEl.textContent=best}
function speed(){const m=modes[mode];return Math.max(62,m.speed-score*m.step)*(performance.now()<slowUntil?1.22:1)}
function clearTimers(){clearInterval(timer);clearInterval(countdownTimer);clearTimeout(foodTimer);clearTimeout(slowTimer);timer=countdownTimer=foodTimer=slowTimer=null}
function reset(){clearTimers();c.classList.remove('game-over');c.classList.remove('new-round');void c.offsetWidth;c.classList.add('new-round');snake=[{x:7,y:6},{x:6,y:6},{x:5,y:6}];dir={x:1,y:0};next={...dir};score=0;running=false;paused=false;over=false;countdown=0;slowUntil=0;specialUntil=0;particles=[];scoreEl.textContent='0';startBtn.textContent='Start';loadBest();spawn();draw()}
function spawn(){let p;do{p={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food={...p,type:Math.random()<.16?(Math.random()<.55?'gold':'blue'):'normal'};specialUntil=food.type==='normal'?0:performance.now()+6500;if(food.type!=='normal'){clearTimeout(foodTimer);foodTimer=setTimeout(()=>{if(food&&food.type!=='normal'){spawn();draw()}},6500)}}
function addBurst(x,y,color){for(let i=0;i<12;i++){const a=Math.PI*2*i/12;particles.push({x:x*cell+20,y:y*cell+20,vx:Math.cos(a)*(1.2+Math.random()*2),vy:Math.sin(a)*(1.2+Math.random()*2),life:1,color})}}
function draw(){ctx.clearRect(0,0,600,480);ctx.strokeStyle='#f0f0f0';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,480);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(600,y*cell);ctx.stroke()}
if(food){const pulse=1+Math.sin(performance.now()/230)*.16,col=food.type==='gold'?'#e5a000':food.type==='blue'?'#3478df':'#ef3340';ctx.save();ctx.shadowColor=col;ctx.shadowBlur=10+Math.sin(performance.now()/230)*5;ctx.fillStyle=col;ctx.beginPath();ctx.arc(food.x*cell+20,food.y*cell+20,(food.type==='normal'?10:12)*pulse,0,Math.PI*2);ctx.fill();ctx.restore();if(food.type!=='normal'){ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(food.type==='gold'?'★':'+',food.x*cell+20,food.y*cell+24)}}
const bodyColor=palettes[Math.floor(score/6)%palettes.length];snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#888':bodyColor;ctx.beginPath();ctx.roundRect(s.x*cell+3,s.y*cell+3,34,34,i===0?10:8);ctx.fill();if(i===0){ctx.fillStyle='#fff';const ex=s.x*cell+20+dir.x*7-dir.y*5,ey=s.y*cell+20+dir.y*7+dir.x*5;ctx.beginPath();ctx.arc(ex,ey,2.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x*cell+20+dir.x*7+dir.y*5,s.y*cell+20+dir.y*7-dir.x*5,2.8,0,Math.PI*2);ctx.fill()}});
particles=particles.filter(p=>p.life>0);particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.life-=.035});ctx.globalAlpha=1;
if(paused||over||countdown>0){ctx.fillStyle='#ffffffdf';ctx.fillRect(0,0,600,480);ctx.fillStyle='#111';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText(over?'GAME OVER':paused?'PAUSE':countdown===1?'GO!':String(countdown),300,220);ctx.font='18px system-ui';ctx.fillText(over?'Punkte: '+score:paused?'Tippe auf Weiter':countdown>0?'Mach dich bereit!':'',300,258)}
}
function updateScore(points){score+=points;scoreEl.textContent=score;scoreEl.classList.remove('pop');void scoreEl.offsetWidth;scoreEl.classList.add('pop');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem(bestKey(),String(best))}catch(e){}}}
function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){const eaten=food;clearTimeout(foodTimer);addBurst(eaten.x,eaten.y,eaten.type==='gold'?'#e5a000':eaten.type==='blue'?'#3478df':'#ef3340');if(eaten.type==='gold')updateScore(5);else if(eaten.type==='blue'){updateScore(3);slowUntil=performance.now()+4500;clearTimeout(slowTimer);slowTimer=setTimeout(()=>{if(running){clearInterval(timer);timer=setInterval(tick,speed())}},4500)}else updateScore(1);spawn();clearInterval(timer);timer=setInterval(tick,speed())}else snake.pop();draw()}
function end(){clearTimers();running=false;paused=false;over=true;countdown=0;startBtn.textContent='Start';c.classList.remove('new-round');c.classList.remove('game-over');void c.offsetWidth;c.classList.add('game-over');draw()}
function startCountdown(){if(over)reset();if(running||countdownTimer)return;paused=false;countdown=3;startBtn.textContent='Pause';draw();countdownTimer=setInterval(()=>{countdown--;draw();if(countdown<=0){clearInterval(countdownTimer);countdownTimer=null;countdown=0;running=true;startBtn.textContent='Pause';timer=setInterval(tick,speed());draw()}},700)}
function toggle(){if(running){clearInterval(timer);timer=null;running=false;paused=true;startBtn.textContent='Weiter';draw()}else if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;countdown=0;paused=true;startBtn.textContent='Weiter';draw()}else if(paused){startCountdown()}else startCountdown()}
function turn(d){if(d.x!==-dir.x||d.y!==-dir.y)next=d}
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{turn(dirs[b.dataset.dir]);if(!running&&!countdownTimer&&!over)startCountdown()}));
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'},d=map[e.key];if(d){e.preventDefault();turn(dirs[d]);if(!running&&!countdownTimer&&!over)startCountdown()}else if(e.key===' '){e.preventDefault();toggle()}});
let touch=null;c.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});c.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});if(!running&&!countdownTimer&&!over)startCountdown()}touch=null},{passive:true});
startBtn.addEventListener('click',toggle);document.getElementById('reset').addEventListener('click',reset);
difficultyEl.addEventListener('change',()=>{mode=difficultyEl.value;modeHint.textContent='● '+modes[mode].label;reset()});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
reset();modeHint.textContent='● '+modes[mode].label;
function animate(){if(particles.length||food)draw();requestAnimationFrame(animate)}requestAnimationFrame(animate);
})();
</script></body></html>
