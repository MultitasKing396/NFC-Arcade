<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f4f4">
<title>NFC Arcade – Snake by Alp</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}body{background:#f4f4f4;color:#111;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;padding:10px}.app{width:min(100%,440px);max-height:100dvh;text-align:center;display:flex;flex-direction:column;justify-content:center}.top{display:flex;justify-content:space-between;align-items:center;margin:3px 0 6px}.brand{font-weight:900;letter-spacing:.12em;font-size:12px;color:#777}.scores{display:flex;gap:16px;font-size:10px;color:#666}.scores b{display:block;color:#111;font-size:19px}.scores b.pop{animation:scorePop .28s ease-out}@keyframes scorePop{0%{transform:scale(1)}45%{transform:scale(1.35);color:#ef3340}100%{transform:scale(1)}}@keyframes boardIn{0%{opacity:0;transform:scale(.94)}65%{opacity:1;transform:scale(1.015)}100%{opacity:1;transform:scale(1)}}@keyframes boardOut{0%{opacity:1;transform:scale(1)}100%{opacity:.65;transform:scale(.97)}}canvas.new-round{animation:boardIn .42s cubic-bezier(.2,.8,.2,1)}canvas.game-over{animation:boardOut .35s ease-out}h1{font-size:33px;margin:2px 0 0;letter-spacing:-1.5px;line-height:1.1}.sub{color:#777;margin:1px 0 7px;font-size:13px;font-weight:650;letter-spacing:.04em}.settings{display:flex;justify-content:center;align-items:center;gap:7px;margin:0 0 8px;font-size:11px;color:#777}.settings select{border:1px solid #ddd;border-radius:9px;background:#fff;padding:5px 9px;font:600 12px system-ui;color:#222}canvas{width:100%;height:auto;display:block;background:#fff;border:1px solid #e4e4e4;border-radius:16px;box-shadow:0 8px 30px #0000000b;touch-action:none}.actions{display:flex;gap:9px;margin-top:9px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;font-size:14px;background:#111;color:#fff;flex:1;touch-action:manipulation}.btn.secondary{background:#e8e8e8;color:#111}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:186px;margin:10px auto 0}.pad button{height:43px;border:0;border-radius:11px;background:#e8e8e8;font-size:20px;font-weight:800;color:#111;touch-action:manipulation}.empty{visibility:hidden}.hint{color:#999;font-size:10px;margin:8px 0 0}@media(prefers-reduced-motion:reduce){canvas.new-round,canvas.game-over,.scores b.pop{animation:none}}

/* Einheitliches NFC-Arcade / Mastermind-Design – reine Darstellung */
:root{--brand-bg:#171717;--brand-panel:#242424;--brand-edge:#555;--brand-cream:#f1eadb;--brand-muted:#aaa;--brand-gold:#d8b66a}
html,body{background:radial-gradient(ellipse at 50% 0,#333 0,#171717 65%)!important;color:var(--brand-cream)!important}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif!important}
.app{color:var(--brand-cream)}
h1{font-family:Georgia,serif!important;color:#e7d7b3!important;text-shadow:0 2px 0 #6b5836!important;letter-spacing:.12em!important}
h2{font-family:Georgia,serif;color:#e8d8b5}
.panel,.stat,.stat,.settings,.side .panel,.theme-preview-wrap{background:linear-gradient(145deg,#2b2b2b,#202020)!important;border:1px solid #555!important;color:#c4bba9!important;box-shadow:0 4px 0 #090909}
button,.btn,.miniAction,.sound,.sprint{border:1px solid #8d7955!important;border-radius:10px!important;background:linear-gradient(#d7bd83,#a88a53)!important;color:#211b12!important;font-weight:800!important;box-shadow:0 3px 0 #100e0b!important}
button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #100e0b!important}
button:disabled{opacity:.4}
select{border:1px solid #666!important;border-radius:9px!important;background:#171717!important;color:#f4ead6!important}
footer,.byline,.sub.byline{display:block;text-align:center;color:#aaa!important;font-size:10px!important;font-weight:700!important;letter-spacing:.16em!important;text-transform:none!important;margin-top:auto!important;padding:8px 0 max(4px,env(safe-area-inset-bottom))!important}

body{padding:12px 10px 8px!important}.app{min-height:100dvh;max-height:none!important;justify-content:flex-start!important;gap:8px;padding:8px 0 0}
.brand{display:none!important}.scores{color:#aaa!important}.scores b{color:#f3e8d2!important}
canvas{border:2px solid #626262!important;border-radius:15px!important;box-shadow:0 5px 0 #090909!important}
.settings{padding:8px 10px;border-radius:10px}.pad button{background:linear-gradient(#555,#333)!important;color:#eee!important;border-color:#777!important}
footer{margin-top:auto!important;padding-bottom:max(12px,env(safe-area-inset-bottom))!important}


/* NFC ARCADE — gemeinsames Finish: Typografie, Oberflächen, Dialoge und Bedienzustände */
:root{
 --arc-bg:#171717;--arc-surface:#252525;--arc-surface-hi:#303030;--arc-border:#595959;
 --arc-gold:#d8b66a;--arc-gold-hi:#ead39c;--arc-text:#f1eadb;--arc-muted:#aaa397;
 --arc-shadow:0 4px 0 #0b0b0b,0 8px 18px #0003;
 color-scheme:dark;
}
html{scrollbar-color:#766344 #171717;scrollbar-width:thin}
body{color:var(--arc-text)!important;accent-color:var(--arc-gold)}
::selection{background:#d8b66a55;color:#fff}
:focus-visible{outline:2px solid var(--arc-gold-hi)!important;outline-offset:3px}
button,.btn,select,input,textarea{font:inherit}
button,.btn{
 transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;
}
button:hover:not(:disabled),.btn:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled),.btn:active:not(:disabled){filter:brightness(.96)}
button:disabled,.btn:disabled{cursor:not-allowed;filter:saturate(.45);opacity:.48}
input:not([type=checkbox]):not([type=radio]),select,textarea{
 background:#191919!important;color:var(--arc-text)!important;border:1px solid #68604f!important;
 border-radius:9px!important;box-shadow:inset 0 1px 3px #0008!important;
}
input::placeholder,textarea::placeholder{color:#827d73!important}
.panel,.stat,.settings,.side .panel,.theme-preview-wrap,.result,.win-card,.dialog{
 background:linear-gradient(145deg,#303030,#202020)!important;
 border:1px solid var(--arc-border)!important;border-radius:13px!important;
 box-shadow:var(--arc-shadow)!important;color:#d8d0c2!important;
}
h1,h2,h3{ text-wrap:balance }
h2,h3{color:#e8d8b5}
.stat,.statsPanel,.note,.message,.help,.hint,.gesture-hint{color:var(--arc-muted)}
hr{border:0;border-top:1px solid #5b4b30}
a{color:var(--arc-gold-hi)}
.overlay,.modal,.win{
 background:#101010df!important;backdrop-filter:blur(7px);
}
.overlay h2,.modal h2,.win h2,.result h2{color:#ead8ae!important;font-family:Georgia,serif!important}
footer,.byline{color:#aaa!important}
@media(hover:none){button:hover:not(:disabled),.btn:hover:not(:disabled){filter:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* Snake: Eingabepad bleibt bewusst dunkel; Spielfeld und Schlange bleiben original. */
.pad button{background:linear-gradient(#555,#333)!important;color:#eee!important;border-color:#777!important}


/* Snake: kompakter Kopfbereich und sichtbarer Footer */
.app{gap:5px;padding:2px 0 0!important}
h1{margin:0 0 1px!important;font-size:31px!important;line-height:1.05!important}
.top{width:100%;margin:0 0 2px!important}
.scores{width:100%;justify-content:space-between!important;gap:12px!important;font-size:10px!important}
.scores>div:first-child{text-align:left}
.scores>div:last-child{text-align:right}
.scores b{font-size:18px!important;line-height:1.05}
.settings{margin:0!important;padding:5px 9px!important}
canvas{max-height: min(42dvh, 340px);width:100%;object-fit:contain}
.actions{margin-top:1px!important}
.pad{width:162px!important;gap:4px!important;margin:3px auto 0!important}
.pad button{height:35px!important}
footer{margin-top:auto!important;padding:4px 0 max(6px,env(safe-area-inset-bottom))!important}

</style></head><body><main class="app">
<h1>Snake.</h1>
<div class="top"><div class="scores"><div>PUNKTE<b id="score">0</b></div><div>HIGHSCORE<b id="best">0</b></div></div></div>
<div class="settings"><label for="difficulty">Schwierigkeit</label><select id="difficulty"><option value="easy">Einfach</option><option value="normal" selected>Normal</option><option value="hard">Schwer</option></select></div>
<canvas id="game" width="600" height="480" aria-label="Snake Spielfeld"></canvas>
<div class="actions"><button class="btn" id="start">Start</button></div>
<div class="pad"><span class="empty"></span><button data-dir="up" aria-label="Hoch">↑</button><span class="empty"></span><button data-dir="left" aria-label="Links">←</button><span class="empty"></span><button data-dir="right" aria-label="Rechts">→</button><span class="empty"></span><button data-dir="down" aria-label="Runter">↓</button><span class="empty"></span></div>
<footer>by Alp</footer>
</main><script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startBtn=document.getElementById('start'),difficultyEl=document.getElementById('difficulty'),cols=15,rows=12,cell=40;
const modes={easy:{label:'Einfach',speed:174,step:2.5},normal:{label:'Normal',speed:152.25,step:3.15},hard:{label:'Schwer',speed:126,step:2.6}};
let snake,food,dir,next,score,best,timer=null,countdownTimer=null,foodTimer=null,slowTimer=null,running=false,paused=false,over=false,countdown=0,specialUntil=0,slowUntil=0,particles=[],mode=difficultyEl.value;
const palettes=['#242424','#2563a6','#168477','#8055a5','#c46b25','#54833c'];
function bestKey(){return 'snakeBest_'+mode}
function loadBest(){try{best=Number(localStorage.getItem(bestKey())||0)}catch(e){best=0}bestEl.textContent=best}
function speed(){const m=modes[mode];return Math.max(62,m.speed-score*m.step)*(performance.now()<slowUntil?1.22:1)}
function clearTimers(){clearInterval(timer);clearInterval(countdownTimer);clearTimeout(foodTimer);clearTimeout(slowTimer);timer=countdownTimer=foodTimer=slowTimer=null}
function reset(){clearTimers();c.classList.remove('game-over');c.classList.remove('new-round');void c.offsetWidth;c.classList.add('new-round');snake=[{x:7,y:6},{x:6,y:6},{x:5,y:6}];dir={x:1,y:0};next={...dir};score=0;running=false;paused=false;over=false;countdown=0;slowUntil=0;specialUntil=0;particles=[];scoreEl.textContent='0';startBtn.textContent='Start';loadBest();spawn();draw()}
function spawn(type='normal'){let p;do{p={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food={...p,type:type==='special'?(Math.random()<.5?'gold':'blue'):'normal'};specialUntil=food.type==='normal'?0:performance.now()+7000;if(food.type!=='normal'){clearTimeout(foodTimer);foodTimer=setTimeout(()=>{if(food&&food.type!=='normal'){spawn('normal');draw()}},7000)}}
function addBurst(x,y,color){for(let i=0;i<12;i++){const a=Math.PI*2*i/12;particles.push({x:x*cell+20,y:y*cell+20,vx:Math.cos(a)*(1.2+Math.random()*2),vy:Math.sin(a)*(1.2+Math.random()*2),life:1,color})}}
function draw(){ctx.clearRect(0,0,600,480);ctx.strokeStyle='#f0f0f0';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,480);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(600,y*cell);ctx.stroke()}
if(food){const pulse=1+Math.sin(performance.now()/230)*.16,col=food.type==='gold'?'#e5a000':food.type==='blue'?'#3478df':'#ef3340';ctx.save();ctx.shadowColor=col;ctx.shadowBlur=10+Math.sin(performance.now()/230)*5;ctx.fillStyle=col;ctx.beginPath();ctx.arc(food.x*cell+20,food.y*cell+20,(food.type==='normal'?10:12)*pulse,0,Math.PI*2);ctx.fill();ctx.restore();if(food.type!=='normal'){ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(food.type==='gold'?'★':'+',food.x*cell+20,food.y*cell+24)}}
const bodyColor=palettes[Math.floor(score/5)%palettes.length];snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#888':bodyColor;ctx.beginPath();ctx.roundRect(s.x*cell+3,s.y*cell+3,34,34,i===0?10:8);ctx.fill();if(i===0){ctx.fillStyle='#fff';const ex=s.x*cell+20+dir.x*7-dir.y*5,ey=s.y*cell+20+dir.y*7+dir.x*5;ctx.beginPath();ctx.arc(ex,ey,2.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x*cell+20+dir.x*7+dir.y*5,s.y*cell+20+dir.y*7-dir.x*5,2.8,0,Math.PI*2);ctx.fill()}});
particles=particles.filter(p=>p.life>0);particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.life-=.035});ctx.globalAlpha=1;
if(paused||over||countdown>0){ctx.fillStyle='#ffffffdf';ctx.fillRect(0,0,600,480);ctx.fillStyle='#111';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText(over?'GAME OVER':paused?'PAUSE':countdown===1?'GO!':String(countdown),300,220);ctx.font='18px system-ui';ctx.fillText(over?'Punkte: '+score:paused?'Tippe auf Weiter':countdown>0?'Mach dich bereit!':'',300,258)}
}
function updateScore(points){const oldBand=Math.floor(score/5);score+=points;const colorChanged=Math.floor(score/5)>oldBand;scoreEl.textContent=score;scoreEl.classList.remove('pop');void scoreEl.offsetWidth;scoreEl.classList.add('pop');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem(bestKey(),String(best))}catch(e){}}return colorChanged}
function hapticFeedback(){try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(8)}catch(e){}}
function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){const eaten=food;hapticFeedback();clearTimeout(foodTimer);addBurst(eaten.x,eaten.y,eaten.type==='gold'?'#e5a000':eaten.type==='blue'?'#3478df':'#ef3340');let colorChanged=false;if(eaten.type==='gold')colorChanged=updateScore(3);else if(eaten.type==='blue'){colorChanged=updateScore(2);slowUntil=performance.now()+4500;clearTimeout(slowTimer);slowTimer=setTimeout(()=>{if(running){clearInterval(timer);timer=setInterval(tick,speed())}},4500)}else colorChanged=updateScore(1);spawn(colorChanged?'special':'normal');clearInterval(timer);timer=setInterval(tick,speed())}else snake.pop();draw()}
function end(){clearTimers();running=false;paused=false;over=true;countdown=0;startBtn.textContent='Start';c.classList.remove('new-round');c.classList.remove('game-over');void c.offsetWidth;c.classList.add('game-over');draw()}
function startCountdown(){if(over)reset();if(running||countdownTimer)return;paused=false;countdown=3;startBtn.textContent='Pause';draw();countdownTimer=setInterval(()=>{countdown--;draw();if(countdown<=0){clearInterval(countdownTimer);countdownTimer=null;countdown=0;running=true;startBtn.textContent='Pause';timer=setInterval(tick,speed());draw()}},700)}
function toggle(){if(running){clearInterval(timer);timer=null;running=false;paused=true;startBtn.textContent='Weiter';draw()}else if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;countdown=0;paused=true;startBtn.textContent='Weiter';draw()}else if(paused){startCountdown()}else startCountdown()}
function turn(d){if(d.x!==-dir.x||d.y!==-dir.y)next=d}
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{turn(dirs[b.dataset.dir]);if(!running&&!countdownTimer&&!over)startCountdown()}));
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'},d=map[e.key];if(d){e.preventDefault();turn(dirs[d]);if(!running&&!countdownTimer&&!over)startCountdown()}else if(e.key===' '){e.preventDefault();toggle()}});
let touch=null;c.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});c.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});if(!running&&!countdownTimer&&!over)startCountdown()}touch=null},{passive:true});
startBtn.addEventListener('click',toggle);
difficultyEl.addEventListener('change',()=>{mode=difficultyEl.value;reset()});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
reset();
function animate(){if(particles.length||food)draw();requestAnimationFrame(animate)}requestAnimationFrame(animate);
})();
</script></body></html>
