<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11151d"><title>NFC Arcade – Schach</title>
<style>
:root{--bg:#11151d;--panel:#1b2230;--text:#f4f5f8;--muted:#aab4c4;--accent:#70dfc0;--light:#eee9dc;--dark:#7e8d78}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:var(--bg);color:var(--text);font:16px system-ui;touch-action:pan-y}.app{max-width:600px;margin:auto;padding:16px 0}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand,.muted,.small{color:var(--muted)}h1{margin:3px 0 14px}.panel,.clock,.menu button{background:var(--panel);border:1px solid #ffffff20;border-radius:15px;padding:15px;margin:10px 0;color:var(--text)}.menu{display:grid;gap:8px}.menu button{text-align:left;font-size:18px;padding:18px}.menu small{display:block;color:var(--muted);font-size:12px;margin-top:5px}button,select{font:inherit;cursor:pointer}button{background:#293448;color:var(--text);border:1px solid #ffffff24;border-radius:11px;padding:12px}.primary{background:var(--accent);color:#10231d;border:0;font-weight:700}.danger{background:#713944}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}select{width:100%;background:#293448;color:white;border:1px solid #ffffff25;border-radius:10px;padding:12px}.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border:5px solid #293448;border-radius:6px;overflow:hidden}.sq{aspect-ratio:1;border:0;border-radius:0;padding:0;position:relative;display:grid;place-items:center;font-size:clamp(29px,9vw,56px);line-height:1;color:#151923}.light{background:var(--light)}.dark{background:var(--dark)}.sq.sel{box-shadow:inset 0 0 0 5px #f2cf55}.sq.hint:after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#164c3699}.sq.capture:after{content:"";position:absolute;inset:4px;border:4px solid #c34e58aa;border-radius:50%}.sq.last{box-shadow:inset 0 0 0 4px #e8ca5c99}.piece{z-index:1;filter:drop-shadow(0 2px 1px #0004)}.clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clock{text-align:center;margin:0}.clock.active{border:2px solid var(--accent)}.time{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.toolbar button{font-size:12px;padding:10px 4px}.hold{touch-action:none}.hold.wait{background:#866a2e}.status{text-align:center;color:var(--muted);min-height:25px;padding:8px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.dialog{width:min(100%,400px);background:var(--panel);padding:20px;border-radius:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stats div{background:#293448;border-radius:10px;text-align:center;padding:9px 3px}.stats b{display:block;font-size:20px}.stats span{font-size:10px;color:var(--muted)}.theme-classic{--bg:#29231d;--panel:#3b3026;--light:#ead8b8;--dark:#997653;--accent:#e6bd79}.theme-future{--bg:#090d20;--panel:#141b36;--light:#b8f5ef;--dark:#343d83;--accent:#ff4fd8}.theme-minimal{--bg:#f0f1f3;--panel:#fff;--text:#202832;--muted:#697481;--light:#f4f1e9;--dark:#9da8b5;--accent:#256e5c;color-scheme:light}.theme-minimal button,.theme-minimal select{color:#202832;background:#e4e7eb}.theme-minimal .primary{background:var(--accent);color:white}@media(min-width:540px){.app{padding-top:25px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">NFC ARCADE</div><h1>Schach</h1></div><button id="home">⌂</button></header>
<section id="main"><div class="panel"><b>Eine Partie gefällig?</b><p class="muted">Klassisches Schach – allein oder zu zweit auf einem Gerät.</p></div><div class="menu"><button id="ai">♟ Gegen KI<small>Schwierigkeitsstufe 1 bis 5</small></button><button id="two">♙ Zwei Spieler<small>Abwechselnd auf demselben Gerät</small></button><button id="settings">⚙ Einstellungen<small>Design und Brettausrichtung</small></button><button id="statsBtn">▤ Statistiken<small>Siege, Niederlagen, Remis und Siegquote</small></button></div></section>
<section id="setup" class="hidden panel"><h2 id="setupTitle">Neue Partie</h2><div class="field" id="levelField"><label>KI-Stärke</label><select id="level"><option value="1">1 – Sehr einfach</option><option value="2">2 – Einfach</option><option value="3" selected>3 – Mittel</option><option value="4">4 – Schwer</option><option value="5">5 – Stärkste verfügbare Stufe</option></select><p class="small" id="levelDesc">Erkennt grundlegende Strategien.</p></div><div class="field"><label>Zeitmodus</label><select id="time"><option value="0">Ohne Zeitlimit</option><option value="3">Blitz – 3 Minuten</option><option value="5">Blitz – 5 Minuten</option><option value="10">Blitz – 10 Minuten</option></select></div><div class="field"><label>Spielfeld-Design</label><select id="theme"><option value="minimal">Minimalistisch</option><option value="classic">Klassisch – Holzoptik</option><option value="future">Modern futuristisch</option></select></div><div class="field"><label>Brettausrichtung</label><select id="orient"><option value="fixed">Fest – Weiß unten</option><option value="auto">Automatisch drehen (2 Spieler)</option></select></div><div class="row"><button id="back">Zurück</button><button class="primary" id="start">Partie starten</button></div></section>
<section id="settingsPage" class="panel hidden"><h2>Einstellungen</h2><div class="field"><label>Standard-Design</label><select id="setTheme"><option value="minimal">Minimalistisch</option><option value="classic">Klassisch</option><option value="future">Modern futuristisch</option></select></div><div class="field"><label>Brettausrichtung</label><select id="setOrient"><option value="fixed">Fest</option><option value="auto">Automatisch drehen</option></select></div><button class="primary" id="saveSettings">Speichern</button> <button id="settingsBack">Zurück</button></section>
<section id="statsPage" class="panel hidden"><h2>Statistiken</h2><div class="stats"><div><b id="wins">0</b><span>Siege</span></div><div><b id="losses">0</b><span>Niederlagen</span></div><div><b id="draws">0</b><span>Remis</span></div><div><b id="rate">0%</b><span>Siegquote</span></div></div><p class="small">Lokal auf diesem Gerät gespeichert.</p><button id="statsBack">Zurück</button></section>
<section id="game" class="hidden"><div class="clocks" id="clocks"><div class="clock" id="bc"><div id="bn">Schwarz</div><div class="time" id="bt">–:––</div></div><div class="clock" id="wc"><div id="wn">Weiß</div><div class="time" id="wt">–:––</div></div></div><div class="status" id="status"></div><div class="board" id="board"></div><div class="toolbar"><button class="hold" id="undo">↶ Zug zurück<br><small>1 Sek. halten</small></button><button id="pause">Ⅱ Pause</button><button id="giveup">⚑ Aufgabe</button></div></section></main>
<div class="modal hidden" id="modal"><div class="dialog" id="dialog"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>\nif(window.Chess){const P=Chess.prototype;P.isGameOver=P.game_over;P.isCheckmate=P.in_checkmate;P.isStalemate=P.in_stalemate;P.isThreefoldRepetition=P.in_threefold_repetition;P.isInsufficientMaterial=P.insufficient_material;P.isCheck=P.in_check;}\n
(()=>{const $=x=>document.getElementById(x),pages=["main","setup","settingsPage","statsPage","game"];let g,mode="ai",level=3,theme="minimal",orient="fixed",limit=0,clock={w:0,b:0},timer=null,stamp=0,paused=false,over=false,thinking=false,undoUsed=false,selected=null,moves=[],last=null,flip=false,hold=null,holdDone=false;const glyph={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"},descs=["","Spielt einfache Züge und eignet sich zum Einstieg.","Erkennt einfache taktische Möglichkeiten.","Erkennt grundlegende Strategien.","Nutzt Taktiken und plant voraus.","Stärkste Stufe dieser kompakten Browser-KI."];function page(p){pages.forEach(x=>$(x).classList.toggle("hidden",x!==p))}function applyTheme(t){theme=t;document.body.className="theme-"+t}function data(){try{return JSON.parse(localStorage.chessStats||'{"wins":0,"losses":0,"draws":0}')}catch{return{wins:0,losses:0,draws:0}}}function stats(){let s=data(),n=s.wins+s.losses+s.draws;["wins","losses","draws"].forEach(k=>$(k).textContent=s[k]);$("rate").textContent=n?Math.round(s.wins/n*100)+"%":"0%"}function save(k){let s=data();s[k]++;localStorage.chessStats=JSON.stringify(s)}function dialog(title,body){$("dialog").innerHTML="<h2>"+title+"</h2>"+body;$("modal").classList.remove("hidden")}function close(){ $("modal").classList.add("hidden")}function fmt(ms){let n=Math.max(0,Math.ceil(ms/1000));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}function updateClock(){if(!limit){$("clocks").classList.add("hidden");return}$("clocks").classList.remove("hidden");$("wt").textContent=fmt(clock.w);$("bt").textContent=fmt(clock.b);$("wc").classList.toggle("active",!over&&!paused&&g.turn()==="w");$("bc").classList.toggle("active",!over&&!paused&&g.turn()==="b")}function stopTimer(){clearInterval(timer);timer=null}function runTimer(){if(!limit)return;stopTimer();stamp=Date.now();timer=setInterval(()=>{if(paused||over||thinking)return;let c=g.turn(),d=Date.now()-stamp;clock[c]-=d;stamp=Date.now();if(clock[c]<=0){clock[c]=0;finish(c==="w"?"b":"w","Zeit abgelaufen")}else updateClock()},250)}function draw(){let b=$("board");b.innerHTML="";if(!g)return;let flipNow=flip&&mode==="two"&&g.turn()==="b";for(let r=0;r<8;r++)for(let f=0;f<8;f++){let file=flipNow?7-f:f,rank=flipNow?r:7-r,sq="abcdefgh"[file]+(rank+1),p=g.get(sq),el=document.createElement("button");el.className="sq "+((file+rank)%2===0?"light":"dark");if(sq===selected)el.classList.add("sel");if(moves.some(m=>m.to===sq))el.classList.add(p?"capture":"hint");if(last&&(last.from===sq||last.to===sq))el.classList.add("last");if(p){let s=document.createElement("span");s.className="piece";s.textContent=glyph[p.color+p.type];s.style.color=p.color==="w"?"#fffdf5":"#20232a";s.style.textShadow=p.color==="w"?"0 1px 2px #333":"0 1px 2px #fff8";el.append(s)}el.setAttribute("aria-label",sq);el.onclick=()=>tap(sq);b.append(el)}$("status").textContent=over?"Partie beendet":paused?"Pausiert":thinking?"KI überlegt …":g.isCheck()?"Schach!":(g.turn()==="w"?"Weiß":"Schwarz")+" ist am Zug";$("undo").disabled=undoUsed||!g.history().length||over;updateClock()}function tap(sq){if(over||paused||thinking||(mode==="ai"&&g.turn()==="b"))return;let p=g.get(sq);if(selected&&moves.some(m=>m.to===sq)){let m=moves.find(x=>x.to===sq);if(m.flags.includes("p")){dialog("Bauernumwandlung",'<p>Wähle eine Figur.</p><div class="row"><button data-p="q">Dame</button><button data-p="r">Turm</button><button data-p="b">Läufer</button><button data-p="n">Springer</button></div>');$("dialog").querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{close();play(selected,sq,x.dataset.p)});return}play(selected,sq);return}if(p&&p.color===g.turn()){selected=sq;moves=g.moves({square:sq,verbose:true});if(mode==="ai"&&level===5)moves=[]}else{selected=null;moves=[]}draw()}function play(from,to,promo="q"){let m;try{m=g.move({from,to,promotion:promo})}catch{return}if(!m)return;last={from,to};selected=null;moves=[];if(g.isGameOver()){let w=g.isCheckmate()?(g.turn()==="w"?"b":"w"):null;finish(w,g.isCheckmate()?"Schachmatt":g.isStalemate()?"Patt":g.isThreefoldRepetition()?"Dreifache Stellungswiederholung":g.isInsufficientMaterial()?"Unzureichendes Material":"Remis");return}if(mode==="two"&&orient==="auto")flip=true;draw();if(mode==="ai"&&g.turn()==="b"){thinking=true;draw();setTimeout(aiMove,[0,150,300,450,650,850][level])}else{stamp=Date.now();draw()}}function evalBoard(x){if(x.isCheckmate())return x.turn()==="w"?-100000:100000;let v={p:100,n:320,b:330,r:500,q:900,k:0},s=0,bd=x.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){let p=bd[r][f];if(p){let z=v[p.type]+(3.5-(Math.abs(3.5-f)+Math.abs(3.5-r))/2)*(p.type==="n"||p.type==="b"?8:p.type==="p"?3:1);s+=p.color==="w"?z:-z}}return s}function search(x,d,a,b,max){if(d===0||x.isGameOver())return evalBoard(x);let ms=x.moves({verbose:true});if(max){let best=-Infinity;for(let m of ms){x.move({from:m.from,to:m.to,promotion:"q"});best=Math.max(best,search(x,d-1,a,b,false));x.undo();a=Math.max(a,best);if(b<=a)break}return best}else{let best=Infinity;for(let m of ms){x.move({from:m.from,to:m.to,promotion:"q"});best=Math.min(best,search(x,d-1,a,b,true));x.undo();b=Math.min(b,best);if(b<=a)break}return best}}function aiMove(){if(over||paused)return;let ms=g.moves({verbose:true}),best=-Infinity,opts=[],depth=level<3?1:level<5?2:3;for(let m of ms){g.move({from:m.from,to:m.to,promotion:"q"});let v=-search(g,depth-1,-Infinity,Infinity,true);g.undo();if(level===1)v+=Math.random()*450-225;if(level===2)v+=Math.random()*80-40;if(v>best){best=v;opts=[m]}else if(v===best)opts.push(m)}let m=opts[Math.floor(Math.random()*opts.length)];thinking=false;play(m.from,m.to)}function finish(w,why){over=true;paused=false;thinking=false;stopTimer();if(w===null)save("draws");else if(w==="w")save("wins");else save("losses");let title=w===null?"Remis":w==="w"?"Weiß gewinnt":"Schwarz gewinnt";dialog(title,"<p>"+why+". "+(mode==="ai"?(w==="w"?"Du hast gewonnen!":w==="b"?"Die KI gewinnt.":"Die Partie endet remis."):title)+'</p><div class="row"><button id="menuEnd">Hauptmenü</button><button class="primary" id="again">Revanche</button></div>');$("menuEnd").onclick=()=>{close();page("main")};$("again").onclick=()=>{close();begin()}}function begin(){if(typeof Chess==="undefined"){dialog("Laden fehlgeschlagen","<p>Die Schachregeln konnten nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</p><button id=\"ok\">Schließen</button>");$("ok").onclick=close;return}g=new Chess();over=paused=thinking=undoUsed=false;selected=null;moves=[];last=null;flip=false;clock={w:limit*60000,b:limit*60000};$("wn").textContent=mode==="ai"?"Du · Weiß":"Weiß";$("bn").textContent=mode==="ai"?"KI · Schwarz":"Schwarz";page("game");draw();runTimer()}function undo(){if(undoUsed||!g||!g.history().length||over)return;g.undo();if(mode==="ai"&&g.turn()==="b"&&g.history().length)g.undo();undoUsed=true;thinking=false;selected=null;moves=[];last=null;stamp=Date.now();draw()}$("undo").onpointerdown=()=>{if($("undo").disabled)return;holdDone=false;$("undo").classList.add("wait");hold=setTimeout(()=>{holdDone=true;undo();$("undo").classList.remove("wait")},1000)};["pointerup","pointerleave","pointercancel"].forEach(e=>$("undo").addEventListener(e,()=>{clearTimeout(hold);$("undo").classList.remove("wait")}));$("undo").onclick=e=>{if(!holdDone)e.preventDefault()};function pause(){if(over)return;paused=true;stopTimer();draw();dialog("Partie pausiert",'<div class="menu"><button class="primary" id="resume">Weiter spielen</button><button class="danger" id="resign">Partie aufgeben</button><button id="leave">Hauptmenü</button></div>');$("resume").onclick=()=>{close();paused=false;runTimer();draw()};$("resign").onclick=()=>{close();confirmResign()};$("leave").onclick=()=>{close();page("main")}}function confirmResign(){paused=true;stopTimer();dialog("Partie aufgeben?",'<p>Möchtest du wirklich aufgeben?</p><div class="row"><button id="cancel">Abbrechen</button><button class="danger" id="yes">Aufgeben</button></div>');$("cancel").onclick=()=>{close();paused=false;runTimer();draw()};$("yes").onclick=()=>{close();finish(g.turn()==="w"?"b":"w","Aufgabe")}}$("ai").onclick=()=>{mode="ai";$("setupTitle").textContent="Gegen KI";$("levelField").classList.remove("hidden");$("level").value=3;$("time").value=0;$("theme").value=theme;$("orient").value=orient;page("setup")};$("two").onclick=()=>{mode="two";$("setupTitle").textContent="Zwei Spieler";$("levelField").classList.add("hidden");$("time").value=0;$("theme").value=theme;$("orient").value=orient;page("setup")};$("level").onchange=()=>$("levelDesc").textContent=descs[+$("level").value];$("back").onclick=()=>page("main");$("start").onclick=()=>{level=+$("level").value;limit=+$("time").value;theme=$("theme").value;orient=$("orient").value;applyTheme(theme);begin()};$("home").onclick=()=>{if(!$("game").classList.contains("hidden")&&!over)pause();else page("main")};$("pause").onclick=pause;$("giveup").onclick=confirmResign;$("settings").onclick=()=>{$("setTheme").value=theme;$("setOrient").value=orient;page("settingsPage")};$("saveSettings").onclick=()=>{theme=$("setTheme").value;orient=$("setOrient").value;localStorage.chessTheme=theme;localStorage.chessOrient=orient;applyTheme(theme);page("main")};$("settingsBack").onclick=()=>page("main");$("statsBtn").onclick=()=>{stats();page("statsPage")};$("statsBack").onclick=()=>page("main");try{theme=localStorage.chessTheme||"minimal";orient=localStorage.chessOrient||"fixed"}catch{}applyTheme(theme);
})();
</script></body></html>
