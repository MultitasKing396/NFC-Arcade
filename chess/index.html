<title>Schach</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1c2738;--panel2:#263449;--text:#f5f7fb;--muted:#aeb9c9;--accent:#70dfc0;--board-light:#f1e9d8;--board-dark:#829b83}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}html{overscroll-behavior:none}body{height:100dvh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);overscroll-behavior:none;touch-action:pan-x pan-y}button,select{font:inherit}button{border:1px solid #ffffff24;border-radius:12px;background:var(--panel2);color:var(--text);padding:12px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.45;cursor:default}.app{width:min(100%,560px);height:100%;max-height:100%;overflow:hidden;margin:0 auto;padding:18px 0 10px}.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}.top h1{font-size:34px;letter-spacing:-1.5px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:14px}.hidden{display:none!important}.intro{text-align:center;padding:25px 8px 22px}.intro strong{display:block;font-size:18px;margin-bottom:5px}.menu{display:grid;gap:11px}.menu button{display:flex;align-items:center;gap:14px;text-align:left;min-height:80px;padding:15px 17px;background:var(--panel);border-radius:16px}.ico{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#70dfc022;color:var(--accent);font-size:25px;flex:none}.copy{display:flex;flex-direction:column;gap:4px;flex:1}.copy b{font-size:17px}.copy small{color:var(--muted);font-size:12px}.arrow{font-size:25px;color:var(--muted)}.panel{background:var(--panel);padding:18px;border-radius:17px;margin-top:16px}.panel h2{margin:0 0 16px}.theme-preview-wrap{margin:16px auto 4px;padding:12px;background:var(--panel2);border-radius:14px;text-align:center}.preview-heading{font-size:13px;color:var(--muted);font-weight:650;margin-bottom:9px}.preview-board{width:min(100%,240px);aspect-ratio:1;margin:0 auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));overflow:hidden;border:3px solid #354258;border-radius:5px}.preview-board .sq{font-size:clamp(12px,4vw,22px);min-width:0;min-height:0;padding:0;border:0;border-radius:0;line-height:1}.preview-caption{font-size:12px;color:var(--muted);margin-top:8px}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}select{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff25;background:var(--panel2);color:var(--text)}.actions{display:flex;gap:9px;justify-content:space-between;margin-top:17px}.primary{background:var(--accent);color:#10251f;font-weight:750;border:0}.gamebar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}.turn{font-weight:700}.status{color:var(--muted);font-size:13px;text-align:center;min-height:23px;margin:8px 0}.board{width:min(100%,calc(100vw - 28px));aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:5px solid #354258;border-radius:8px;overflow:hidden;position:relative;isolation:isolate;touch-action:manipulation;box-shadow:0 12px 28px #0004}.sq{border:0;border-radius:0;padding:0;margin:0;min-width:0;min-height:0;display:grid;place-items:center;position:relative;font-size:clamp(29px,9vw,54px);line-height:1;touch-action:manipulation}.sq.light{background:var(--board-light)}.sq.dark{background:var(--board-dark)}.sq.selected{box-shadow:inset 0 0 0 4px #f4c94e}.sq.last{box-shadow:inset 0 0 0 4px #e8c65b99}.sq.check-king,.sq.checker{background:#facc15!important;box-shadow:inset 0 0 0 4px #b77908}.sq.check-king .piece,.sq.checker .piece{filter:drop-shadow(0 1px 2px #6b4a00)}.sq.legal:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#173d2e88;pointer-events:none}.sq.capture:after{content:"";position:absolute;inset:4px;border:4px solid #b9414bba;border-radius:50%;pointer-events:none}.piece{z-index:1;position:relative;pointer-events:none;user-select:none}.sq.white-piece .piece{color:#fffdf4;text-shadow:0 1px 2px #333,0 0 2px #333}.sq.black-piece .piece{color:#080b10;text-shadow:0 1px 1px #fff9}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.toolbar button{font-size:13px;padding:11px 5px}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:30}.dialog{width:min(100%,390px);background:var(--panel);padding:21px;border:1px solid #ffffff20;border-radius:18px;box-shadow:0 20px 60px #0008}.dialog h2{margin:0 0 9px}.dialog p{color:var(--muted);line-height:1.5}.dialog .actions{justify-content:flex-end}.theme-classic{--bg:#29231d;--panel:#3b3026;--panel2:#514333;--board-light:#f3ead8;--board-dark:#956b46;--accent:#e6bd79}.theme-future{--bg:#090d20;--panel:#141b36;--panel2:#202b50;--board-light:#b8f5ef;--board-dark:#5260a5;--accent:#ff70d9}.theme-minimal{--bg:#f1f3f5;--panel:#fff;--panel2:#e8edf1;--text:#202832;--muted:#667381;--accent:#256e5c;--board-light:#ffffff;--board-dark:#202020;color-scheme:light}.theme-minimal .board{border-color:#c6cdd4;box-shadow:0 10px 24px #17212b20}.theme-minimal button{border-color:#d8dfe5}.theme-minimal .menu button{background:#fff}.theme-minimal .ico{background:#256e5c18;color:#256e5c}.theme-minimal .primary{background:#256e5c;color:white}.theme-minimal select{background:#fff;color:#202832;border-color:#d8dfe5}.theme-minimal .sq.light{background:#ffffff}.theme-minimal .sq.dark{background:#202020}.theme-minimal .sq.white-piece .piece{color:#ffffff;text-shadow:0 1px 1px #555}.theme-minimal .sq.black-piece .piece{color:#080808;text-shadow:none}.theme-classic .sq.white-piece .piece{color:#f4dfb5;text-shadow:0 1px 1px #654b31,0 0 2px #fff0d0}.theme-classic .sq.black-piece .piece{color:#684326;text-shadow:0 1px 1px #e4c99f,0 0 2px #4b2e18}.theme-classic .sq.black-piece .piece{font-family:"DejaVu Sans", "Segoe UI Symbol",serif;font-weight:900;-webkit-text-stroke:.45px currentColor}.theme-future .sq.white-piece .piece{color:#ff3fcf;text-shadow:0 0 5px #ff3fcf,0 0 11px #ff3fcf,0 0 19px #ff1493}.theme-future .sq.black-piece .piece{color:#35eaff;text-shadow:0 0 5px #35eaff,0 0 11px #35eaff,0 0 19px #00bfff}
@media(prefers-reduced-motion:reduce){.moving-piece{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><h1>Schach</h1><button id="homeBtn" class="hidden" aria-label="Hauptmenü">⌂</button></header>
<section id="homePage">
<div class="intro"><strong>Dein nächstes Spiel wartet.</strong><span class="sub">Wähle, wie du spielen möchtest.</span></div>
<div class="menu">
<button id="playAI"><span class="ico">♟</span><span class="copy"><b>Gegen KI</b><small>Spiele gegen den Computer</small></span><span class="arrow">›</span></button>
<button id="playLocal"><span class="ico">♙</span><span class="copy"><b>Gegen Mitspieler</b><small>Zu zweit an einem Gerät</small></span><span class="arrow">›</span></button>
<button id="openSettings"><span class="ico">⚙</span><span class="copy"><b>Einstellungen</b><small>Design und Spieloptionen</small></span><span class="arrow">›</span></button>
</div>
</section>
<section id="setupPage" class="panel hidden">
<h2 id="setupTitle">Neue Partie</h2>
<div id="difficultyField" class="field"><label for="difficulty">KI-Schwierigkeit</label><select id="difficulty"><option value="1">1 – Einfach</option><option value="2">2 – Locker</option><option value="3" selected>3 – Mittel</option><option value="4">4 – Anspruchsvoll</option><option value="5">5 – Schwer</option></select></div>
<div class="field"><label for="themeSelect">Spielfeld-Design</label><select id="themeSelect"><option value="minimal">Minimalistisch</option><option value="classic">Klassisch</option><option value="future">Futuristisch</option></select></div>
<div class="actions"><button id="setupBack">Zurück</button><button id="startGame" class="primary">Partie starten</button></div>
</section>
<section id="settingsPage" class="panel hidden"><h2>Einstellungen</h2>
<div class="field"><label for="defaultTheme">Standard-Design</label><select id="defaultTheme"><option value="minimal">Minimalistisch</option><option value="classic">Klassisch</option><option value="future">Futuristisch</option></select></div>
<div class="theme-preview-wrap" id="themePreview">
 <div class="preview-heading">Vorschau</div>
 <div class="preview-board" id="previewBoard" aria-label="Vorschau des Schachbretts"></div>
 <div class="preview-caption" id="previewCaption">Minimalistisch</div>
</div>
<div class="actions"><button id="settingsBack">Zurück</button><button id="saveSettings" class="primary">Speichern</button></div>
</section>
<section id="gamePage" class="hidden">
<div class="gamebar"><span id="gameMode" class="turn">Gegen KI</span><span id="turnLabel" class="sub">Weiß am Zug</span></div>
<div id="status" class="status" aria-live="polite">Wähle eine Figur.</div>
<div id="board" class="board" aria-label="Schachbrett"></div>
<div class="toolbar"><button id="undoBtn">↶ Zurück</button><button id="newBtn">↻ Neu starten</button><button id="exitBtn">⌂ Menü</button></div>
<div class="note">Figur antippen, danach das Zielfeld antippen.</div>
</section>
</main>
<div id="modal" class="overlay hidden"><div id="dialog" class="dialog"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const pages=["homePage","setupPage","settingsPage","gamePage"];
let chess=null,mode="ai",difficulty=3,theme="minimal",selected=null,legal=[],lastMove=null,locked=false,gameFinished=false,historyBefore=[];const SAVE_KEY="nfcChessSavedGame",SETTINGS_KEY="nfcChessSettings";
const symbols={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♟",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"};
function showPage(id){pages.forEach(p=>$(p).classList.toggle("hidden",p!==id));$("homeBtn").classList.toggle("hidden",id==="homePage")}
function setTheme(t){theme=t;document.documentElement.className="theme-"+t;document.body.className="theme-"+t;try{localStorage.setItem("chessTheme",t);const z=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");z.theme=t;localStorage.setItem(SETTINGS_KEY,JSON.stringify(z))}catch{}}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({theme,difficulty}))}catch{}}
function saveGame(){if(!chess||gameFinished){try{localStorage.removeItem(SAVE_KEY)}catch{}return}try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,mode,difficulty,theme,fen:chess.fen(),moves:chess.history(),savedAt:Date.now()}))}catch{}}
function restoreSavedGame(){let data;try{data=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch{}if(!data||!Array.isArray(data.moves)||typeof window.Chess!=="function")return false;try{chess=new window.Chess();for(const san of data.moves){if(!chess.move(san))throw new Error("Invalid saved move")}if(data.fen&&chess.fen()!==data.fen)throw new Error("Position mismatch");mode=data.mode==="two"?"two":"ai";difficulty=Math.max(1,Math.min(5,Number(data.difficulty)||3));theme=["minimal","classic","future"].includes(data.theme)?data.theme:"minimal";setTheme(theme);selected=null;legal=[];lastMove=null;locked=false;gameFinished=chess.game_over();$("gameMode").textContent=mode==="ai"?"Gegen KI":"Zwei Spieler";showPage("gamePage");renderBoard();if(!gameFinished&&mode==="ai"&&chess.turn()==="b"){locked=true;renderBoard();setTimeout(aiMove,250)}return true}catch(e){try{localStorage.removeItem(SAVE_KEY)}catch{}return false}}
function offerSavedGame(){let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch{}if(!saved||!Array.isArray(saved.moves)||!saved.moves.length)return;modal("Gespeicherte Partie gefunden","Möchtest du dort weiterspielen, wo du aufgehört hast?",[{label:"Neue Partie",action:()=>{try{localStorage.removeItem(SAVE_KEY)}catch{}closeModal()}},{label:"Fortsetzen",primary:true,action:()=>{closeModal();if(!restoreSavedGame())modal("Spielstand nicht lesbar","Der gespeicherte Spielstand konnte nicht geladen werden.",[{label:"OK",primary:true,action:closeModal}])}}])}
function closeModal(){$("modal").classList.add("hidden")}
function modal(title,message,buttons){$("dialog").innerHTML="<h2>"+title+"</h2><p>"+message+"</p><div class=\"actions\"></div>";const area=$("dialog").querySelector(".actions");buttons.forEach(b=>{const el=document.createElement("button");el.textContent=b.label;if(b.primary)el.className="primary";el.addEventListener("click",b.action);area.append(el)});$("modal").classList.remove("hidden")}
function startSetup(which){mode=which;$("setupTitle").textContent=which==="ai"?"Gegen KI":"Zwei Spieler";$("difficultyField").classList.toggle("hidden",which!=="ai");$("difficulty").value=String(difficulty);$("themeSelect").value=theme;showPage("setupPage")}
function startGame(){if(typeof window.Chess!=="function"){modal("Schach lädt nicht","Die Schachbibliothek konnte nicht geladen werden. Bitte prüfe die Internetverbindung und lade die Seite neu.",[{label:"Schliessen",primary:true,action:closeModal}]);return}chess=new window.Chess();selected=null;legal=[];lastMove=null;locked=false;gameFinished=false;historyBefore=[];saveSettings();saveGame();$("gameMode").textContent=mode==="ai"?"Gegen KI":"Zwei Spieler";$("turnLabel").textContent="Weiß am Zug";$("status").textContent="Wähle eine Figur.";showPage("gamePage");renderBoard()}
function squareName(file,rank){return "abcdefgh"[file]+(rank+1)}
function pieceAttacks(position,fromRow,fromCol,toRow,toCol,piece){const dr=toRow-fromRow,dc=toCol-fromCol,kind=piece.type;if(dr===0&&dc===0)return false;if(kind==="p")return piece.color==="w"?dr===-1&&Math.abs(dc)===1:dr===1&&Math.abs(dc)===1;if(kind==="n")return(Math.abs(dr)===2&&Math.abs(dc)===1)||(Math.abs(dr)===1&&Math.abs(dc)===2);if(kind==="k")return Math.max(Math.abs(dr),Math.abs(dc))===1;const diagonal=Math.abs(dr)===Math.abs(dc),straight=dr===0||dc===0;if(kind==="b"&&!diagonal||kind==="r"&&!straight||kind==="q"&&!diagonal&&!straight)return false;const sr=Math.sign(dr),sc=Math.sign(dc);let r=fromRow+sr,c=fromCol+sc;while(r!==toRow||c!==toCol){if(position[r][c])return false;r+=sr;c+=sc}return true}
function checkSquares(position){const result=new Set();if(!chess.in_check())return result;let king=null;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=position[r][c];if(p&&p.type==="k"&&p.color===chess.turn())king=[r,c]}if(!king)return result;result.add(squareName(7-king[0],7-king[1]));for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=position[r][c];if(p&&p.color!==chess.turn()&&pieceAttacks(position,r,c,king[0],king[1],p))result.add(squareName(7-c,7-r))}return result}
function renderBoard(){const board=$("board");board.innerHTML="";if(!chess)return;const position=chess.board(),checks=checkSquares(position);for(let displayRow=0;displayRow<8;displayRow++){for(let displayCol=0;displayCol<8;displayCol++){const file=displayCol,rank=7-displayRow,sq=squareName(file,rank),piece=position[displayRow][displayCol],cell=document.createElement("button");cell.type="button";cell.className="sq "+((file+rank)%2===0?"light":"dark");cell.dataset.square=sq;cell.setAttribute("aria-label",sq);if(selected===sq)cell.classList.add("selected");if(lastMove&&(lastMove.from===sq||lastMove.to===sq))cell.classList.add("last");if(checks.has(sq))cell.classList.add(piece&&piece.type==="k"?"check-king":"checker");if(legal.some(m=>m.to===sq))cell.classList.add(piece?"capture":"legal");if(piece){cell.classList.add(piece.color==="w"?"white-piece":"black-piece");const span=document.createElement("span");span.className="piece";span.textContent=symbols[piece.color+piece.type];cell.append(span)}cell.addEventListener("click",()=>handleSquare(sq));board.append(cell)}}$("turnLabel").textContent=(chess.turn()==="w"?"Weiß":"Schwarz")+" am Zug";if(gameFinished)$("status").textContent="Partie beendet";else if(locked)$("status").textContent="Die KI überlegt …";else if(chess.in_check())$("status").textContent="Schach! König und angreifende Figur sind gelb markiert.";else $("status").textContent="Wähle eine Figur oder ein Zielfeld."}
function handleSquare(sq){if(!chess||locked||gameFinished||$("modal").classList.contains("hidden")===false)return;if(mode==="ai"&&chess.turn()==="b")return;const piece=chess.get(sq);if(selected&&legal.some(m=>m.to===sq)){const move=legal.find(m=>m.to===sq);if(move.flags.includes("p")){askPromotion(selected,sq);return}makeMove(selected,sq);return}if(piece&&piece.color===chess.turn()){selected=sq;legal=chess.moves({square:sq,verbose:true});renderBoard();return}selected=null;legal=[];renderBoard()}
function askPromotion(from,to){modal("Bauernumwandlung","Welche Figur möchtest du erhalten?",[{label:"Dame",primary:true,action:()=>{closeModal();makeMove(from,to,"q")}},{label:"Turm",action:()=>{closeModal();makeMove(from,to,"r")}},{label:"Läufer",action:()=>{closeModal();makeMove(from,to,"b")}},{label:"Springer",action:()=>{closeModal();makeMove(from,to,"n")}}])}
function animateMove(from,to,movingPiece,done){const board=$("board"),source=board.querySelector('[data-square="'+from+'"]'),target=board.querySelector('[data-square="'+to+'"]');if(!source||!target){done();return}const a=source.getBoundingClientRect(),b=target.getBoundingClientRect(),ghost=document.createElement("span");ghost.className="piece moving-piece";ghost.textContent=symbols[movingPiece.color+movingPiece.type];const future=document.body.classList.contains("theme-future"),classic=document.body.classList.contains("theme-classic"),pieceColor=future?(movingPiece.color==="w"?"#ff3fcf":"#35eaff"):classic?(movingPiece.color==="w"?"#f4dfb5":"#684326"):(movingPiece.color==="w"?"#ffffff":"#080808"),pieceGlow=future?(movingPiece.color==="w"?"0 0 5px #ff3fcf,0 0 11px #ff3fcf,0 0 19px #ff1493":"0 0 5px #35eaff,0 0 11px #35eaff,0 0 19px #00bfff"):classic?(movingPiece.color==="w"?"0 1px 1px #654b31,0 0 2px #fff0d0":"0 1px 1px #e4c99f,0 0 2px #4b2e18"):(movingPiece.color==="w"?"0 1px 1px #555":"none");ghost.style.cssText="position:fixed;z-index:50;pointer-events:none;display:grid;place-items:center;width:"+a.width+"px;height:"+a.height+"px;left:"+a.left+"px;top:"+a.top+"px;font-size:"+getComputedStyle(source).fontSize+";line-height:1;color:"+pieceColor+";text-shadow:"+pieceGlow+";transition:transform 260ms cubic-bezier(.2,.75,.25,1);";document.body.append(ghost);const landed=target.querySelector(".piece");if(landed)landed.style.visibility="hidden";void ghost.offsetWidth;requestAnimationFrame(()=>{ghost.style.transform="translate("+(b.left-a.left)+"px,"+(b.top-a.top)+"px)"});let ended=false;const finish=()=>{if(ended)return;ended=true;ghost.remove();if(landed)landed.style.visibility="";done()};ghost.addEventListener("transitionend",finish,{once:true});setTimeout(finish,360)}
function makeMove(from,to,promotion="q"){if(!chess||locked||gameFinished)return;const moving=chess.get(from);if(!moving)return;let result;try{result=chess.move({from,to,promotion})}catch(e){result=null}if(!result)return;historyBefore.push({fen:chess.fen(),move:result});lastMove={from,to};saveGame();selected=null;legal=[];const terminal=chess.game_over();const aiTurn=mode==="ai"&&chess.turn()==="b"&&!terminal;locked=aiTurn;renderBoard();animateMove(from,to,moving,()=>{if(terminal){endGame();return}if(aiTurn){setTimeout(aiMove,180)}else{locked=false;renderBoard()}})}
function aiMove(){if(!chess||gameFinished||mode!=="ai"||chess.turn()!=="b")return;let moves=chess.moves({verbose:true});if(!moves.length){locked=false;endGame();return}let scored=moves.map(m=>{let score=0;if(m.flags.includes("c")||m.flags.includes("e"))score+=pieceValue(m.captured||"p")*1.4;if(m.promotion)score+=800;if(m.san.includes("+"))score+=45;if(m.san.includes("#"))score+=100000;score+=(Math.random()-.5)*(6-difficulty)*90;return{move:m,score}});scored.sort((a,b)=>b.score-a.score);let pick;if(difficulty<=2)pick=scored[Math.floor(Math.random()*Math.min(scored.length,Math.max(1,7-difficulty*2)))];else pick=scored[0];const m=pick.move;const moving=chess.get(m.from);let result;try{result=chess.move({from:m.from,to:m.to,promotion:m.promotion||"q"})}catch(e){result=null}if(!result){locked=false;renderBoard();return}lastMove={from:m.from,to:m.to};selected=null;legal=[];saveGame();const terminal=chess.game_over();renderBoard();animateMove(m.from,m.to,moving,()=>{locked=false;if(terminal)endGame();else renderBoard()})}
function pieceValue(p){return({p:100,n:310,b:330,r:500,q:900,k:20000})[p]||0}
function endGame(){gameFinished=true;locked=false;try{localStorage.removeItem(SAVE_KEY)}catch{}renderBoard();let title,message;if(chess.in_checkmate()){title="Schachmatt";message=(chess.turn()==="w"?"Schwarz":"Weiß")+" gewinnt."}else if(chess.in_stalemate()){title="Patt";message="Die Partie endet unentschieden."}else if(chess.in_draw()){title="Remis";message="Die Partie endet unentschieden."}else{title="Partie beendet";message="Die Partie ist beendet."}modal(title,message,[{label:"Hauptmenü",action:()=>{closeModal();showPage("homePage")}},{label:"Neue Partie",primary:true,action:()=>{closeModal();startGame()}}])}
function undoMove(){if(!chess||locked||!chess.history().length||gameFinished)return;chess.undo();if(mode==="ai"&&chess.turn()==="b"&&chess.history().length)chess.undo();saveGame();selected=null;legal=[];lastMove=null;historyBefore=[];renderBoard()}
function goHome(){if(chess&&!gameFinished&&chess.history().length){modal("Partie verlassen?","Dein aktuelles Spiel wird beendet.",[{label:"Weiterspielen",primary:true,action:closeModal},{label:"Zum Menü",action:()=>{closeModal();locked=false;showPage("homePage")}}])}else showPage("homePage")}
$("playAI").addEventListener("click",()=>startSetup("ai"));
$("playLocal").addEventListener("click",()=>startSetup("two"));
function renderThemePreview(t){const wrap=$("themePreview"),board=$("previewBoard");wrap.className="theme-preview-wrap theme-"+t;$("previewCaption").textContent=t==="classic"?"Klassisch":t==="future"?"Futuristisch":"Minimalistisch";const back=["r","n","b","q","k","b","n","r"],pieces=[...back.map(x=>"b"+x),...Array(8).fill("bp"),...Array(32).fill(null),...Array(8).fill("wp"),...back.map(x=>"w"+x)];const glyph={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♟",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"};board.innerHTML="";pieces.forEach((p,i)=>{const row=Math.floor(i/8),col=i%8,cell=document.createElement("div");cell.className="sq "+((row+col)%2===0?"light":"dark");if(p){cell.classList.add(p[0]==="w"?"white-piece":"black-piece");const span=document.createElement("span");span.className="piece";span.textContent=glyph[p];cell.append(span)}board.append(cell)})}$("openSettings").addEventListener("click",()=>{ $("defaultTheme").value=theme;showPage("settingsPage")});
$("setupBack").addEventListener("click",()=>showPage("homePage"));
$("startGame").addEventListener("click",()=>{difficulty=Number($("difficulty").value);setTheme($("themeSelect").value);saveSettings();startGame()});
$("defaultTheme").addEventListener("change",()=>renderThemePreview($("defaultTheme").value));
$("settingsBack").addEventListener("click",()=>showPage("homePage"));
$("saveSettings").addEventListener("click",()=>{setTheme($("defaultTheme").value);showPage("homePage")});
$("homeBtn").addEventListener("click",goHome);
$("undoBtn").addEventListener("click",undoMove);
$("newBtn").addEventListener("click",()=>modal("Neue Partie?","Möchtest du die aktuelle Partie neu starten?",[{label:"Abbrechen",action:closeModal},{label:"Neu starten",primary:true,action:()=>{closeModal();startGame()}}]));
$("exitBtn").addEventListener("click",goHome);
try{const savedSettings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");theme=savedSettings.theme||localStorage.getItem("chessTheme")||"minimal";difficulty=Math.max(1,Math.min(5,Number(savedSettings.difficulty)||3))}catch{theme="minimal";difficulty=3}setTheme(theme);$("difficulty").value=String(difficulty);renderThemePreview(theme);showPage("homePage");setTimeout(offerSavedGame,250);
})();
</script>
